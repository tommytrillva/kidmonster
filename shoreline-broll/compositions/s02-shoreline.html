<template id="s02-template">
  <div id="s02" data-composition-id="s02" data-width="1920" data-height="1080">
    <!-- BG decoratives -->
    <div class="s02-glow-sunset" data-layout-ignore></div>
    <div class="s02-glow-rose" data-layout-ignore></div>
    <div class="s02-wash" data-layout-ignore></div>
    <div class="s02-particles" data-layout-ignore></div>

    <!-- MG: sun, horizon, water -->
    <div class="s02-sun-rise">
      <div class="s02-sun">
        <div class="s02-sun-halo"></div>
        <div class="s02-sun-core"></div>
      </div>
    </div>

    <div class="s02-horizon-wrap" data-layout-allow-overflow>
      <div class="s02-horizon-glow"></div>
      <div class="s02-horizon-core"></div>
    </div>

    <div class="s02-water" data-layout-allow-overflow>
      <div class="s02-shimmer s02-shim-a"></div>
      <div class="s02-shimmer s02-shim-b"></div>
      <div class="s02-shimmer s02-shim-c"></div>
      <div class="s02-shimmer s02-shim-d"></div>
      <div class="s02-shimmer s02-shim-e"></div>
      <div class="s02-shimmer s02-shim-f"></div>
    </div>

    <!-- FG: waveform remnant + elevation hairlines -->
    <div class="s02-wave-remnant"></div>
    <div class="s02-hairline s02-hair-a"></div>
    <div class="s02-hairline s02-hair-b"></div>

    <style>
      #s02 {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: #050a06;
        overflow: hidden;
      }

      /* ---------- BG decoratives ---------- */
      #s02 .s02-glow-sunset {
        position: absolute;
        left: 260px;
        top: 760px;
        width: 1400px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 138, 61, 0.22) 0%,
          rgba(255, 138, 61, 0.10) 38%,
          rgba(255, 138, 61, 0) 70%
        );
      }
      #s02 .s02-glow-rose {
        position: absolute;
        left: 240px;
        top: 420px;
        width: 980px;
        height: 480px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 100, 115, 0.16) 0%,
          rgba(255, 100, 115, 0.07) 42%,
          rgba(255, 100, 115, 0) 72%
        );
      }
      #s02 .s02-wash {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 660px;
        opacity: 0;
        background: radial-gradient(
          ellipse 130% 95% at 50% -12%,
          rgba(255, 138, 61, 0.55) 0%,
          rgba(255, 100, 115, 0.20) 46%,
          rgba(255, 138, 61, 0) 76%
        );
      }
      #s02 .s02-particles {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      #s02 .s02-particle {
        position: absolute;
        border-radius: 999px;
      }

      /* ---------- Sun ---------- */
      #s02 .s02-sun-rise {
        position: absolute;
        left: 1040px;
        top: 300px;
        width: 400px;
        height: 400px;
      }
      #s02 .s02-sun {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(
          circle at center,
          rgba(255, 198, 92, 0.50) 0%,
          rgba(255, 138, 61, 0.26) 32%,
          rgba(255, 100, 115, 0.10) 56%,
          rgba(255, 138, 61, 0) 74%
        );
        border-radius: 50%;
      }
      #s02 .s02-sun-halo {
        position: absolute;
        left: 60px;
        top: 60px;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        opacity: 0.5;
        background: radial-gradient(
          circle at center,
          rgba(255, 198, 92, 0.45) 0%,
          rgba(255, 138, 61, 0.18) 48%,
          rgba(255, 198, 92, 0) 72%
        );
      }
      #s02 .s02-sun-core {
        position: absolute;
        left: 172px;
        top: 172px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(
          circle at center,
          rgba(255, 198, 92, 0.9) 0%,
          rgba(255, 198, 92, 0.4) 55%,
          rgba(255, 198, 92, 0) 78%
        );
      }

      /* ---------- Horizon ---------- */
      #s02 .s02-horizon-wrap {
        position: absolute;
        left: 0;
        top: 624px;
        width: 1920px;
        height: 32px;
        transform-origin: 50% 50%;
      }
      #s02 .s02-horizon-glow {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 32px;
        opacity: 0.35;
        filter: blur(6px);
        background: radial-gradient(
          ellipse 60% 100% at 50% 50%,
          rgba(198, 255, 77, 0.55) 0%,
          rgba(143, 224, 0, 0.22) 48%,
          rgba(143, 224, 0, 0) 78%
        );
      }
      #s02 .s02-horizon-core {
        position: absolute;
        left: 0;
        top: 14px;
        width: 1920px;
        height: 3px;
        border-radius: 999px;
        transform-origin: 50% 50%;
        background: #c6ff4d;
        box-shadow:
          0 0 18px rgba(198, 255, 77, 0.7),
          0 0 60px rgba(143, 224, 0, 0.4);
      }

      /* ---------- Water shimmer band ---------- */
      #s02 .s02-water {
        position: absolute;
        left: 0;
        top: 640px;
        width: 1920px;
        height: 440px;
        opacity: 0;
      }
      #s02 .s02-shimmer {
        position: absolute;
        height: 2px;
        border-radius: 999px;
        left: 50%;
      }
      #s02 .s02-shim-a { top: 28px;  width: 1680px; margin-left: -840px; background: rgba(53, 208, 186, 0.9); }
      #s02 .s02-shim-b { top: 62px;  width: 1460px; margin-left: -730px; background: rgba(234, 245, 226, 0.8); }
      #s02 .s02-shim-c { top: 104px; width: 1240px; margin-left: -620px; background: rgba(53, 208, 186, 0.9); }
      #s02 .s02-shim-d { top: 156px; width: 1520px; margin-left: -760px; background: rgba(62, 142, 14, 0.9); }
      #s02 .s02-shim-e { top: 220px; width: 1100px; margin-left: -550px; background: rgba(53, 208, 186, 0.85); }
      #s02 .s02-shim-f { top: 300px; width: 1340px; margin-left: -670px; background: rgba(234, 245, 226, 0.7); }

      /* ---------- FG ---------- */
      #s02 .s02-wave-remnant {
        position: absolute;
        left: 130px;
        top: 568px;
        height: 72px;
        display: flex;
        align-items: flex-end;
        gap: 5px;
      }
      #s02 .s02-wave-bar {
        width: 5px;
        border-radius: 999px;
        background: #8fe000;
        box-shadow: 0 0 10px rgba(143, 224, 0, 0.45);
        transform-origin: 50% 100%;
        opacity: 0.7;
      }
      #s02 .s02-hairline {
        position: absolute;
        height: 2px;
        border-radius: 999px;
        background: #3e8e0e;
        transform-origin: 0% 50%;
      }
      #s02 .s02-hair-a { left: 240px; top: 432px; width: 1080px; opacity: 0.18; }
      #s02 .s02-hair-b { left: 560px; top: 512px; width: 760px;  opacity: 0.14; }
    </style>

    <script src="../vendor/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '#s02 ';
        const DUR = 15;

        // finite-repeat helper: covers (DUR - start) with half-cycles of length `half`
        const rep = (start, half) => Math.ceil((DUR - start) / half) - 1;

        // mulberry32 — deterministic PRNG, seed fixed
        const mulberry32 = (s) => () => {
          s |= 0;
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const rnd = mulberry32(20260202);

        // ---------- build generated DOM synchronously ----------
        // sea-spray particle field (~26 dots, teal/green)
        const pField = document.querySelector(S + '.s02-particles');
        const particles = [];
        for (let i = 0; i < 26; i++) {
          const d = document.createElement('div');
          d.className = 's02-particle';
          const sz = 2 + Math.round(rnd());
          d.style.width = sz + 'px';
          d.style.height = sz + 'px';
          d.style.left = (rnd() * 1870).toFixed(1) + 'px';
          d.style.top = (340 + rnd() * 680).toFixed(1) + 'px';
          d.style.background = rnd() < 0.72 ? 'rgba(53, 208, 186, 0.85)' : 'rgba(143, 224, 0, 0.75)';
          d.style.opacity = (0.12 + rnd() * 0.13).toFixed(3);
          pField.appendChild(d);
          particles.push(d);
        }

        // waveform remnant: 7 bars, PRNG heights
        const bWrap = document.querySelector(S + '.s02-wave-remnant');
        const bars = [];
        for (let i = 0; i < 7; i++) {
          const b = document.createElement('div');
          b.className = 's02-wave-bar';
          b.style.height = (18 + Math.round(rnd() * 46)) + 'px';
          bWrap.appendChild(b);
          bars.push(b);
        }

        // ---------- timeline (everything on tl, all fromTo) ----------

        // BG ambients (start >= 0.3)
        tl.fromTo(S + '.s02-glow-sunset', { scale: 1 },
          { scale: 1.09, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: rep(0.3, 2.2) }, 0.3);
        tl.fromTo(S + '.s02-glow-rose', { x: 0 },
          { x: 54, duration: 3.0, ease: 'sine.inOut', yoyo: true, repeat: rep(0.3, 3.0) }, 0.3);

        // particle field: fade up, then each dot drifts up-right for the whole scene
        tl.fromTo(S + '.s02-particles', { opacity: 0 },
          { opacity: 1, duration: 1.8, ease: 'power1.out' }, 0.5);
        particles.forEach((d) => {
          tl.fromTo(d, { x: 0, y: 0 },
            { x: 60 + rnd() * 140, y: -(70 + rnd() * 170), duration: 14.4, ease: 'none' }, 0.3);
        });

        // horizon draws across the frame
        tl.fromTo(S + '.s02-horizon-wrap', { scaleX: 0 },
          { scaleX: 1, duration: 1.4, ease: 'power2.inOut' }, 0.6);

        // horizon heartbeat: core scaleY + glow opacity, ~1.7s cycle, finite
        tl.fromTo(S + '.s02-horizon-core', { scaleY: 1 },
          { scaleY: 2.0, duration: 0.85, ease: 'sine.inOut', yoyo: true, repeat: rep(2.25, 0.85) }, 2.25);
        tl.fromTo(S + '.s02-horizon-glow', { opacity: 0.35 },
          { opacity: 0.7, duration: 0.85, ease: 'sine.inOut', yoyo: true, repeat: rep(2.25, 0.85) }, 2.25);

        // sun: slow rise on wrapper, bloom on disc, breathe on halo (split = one transform each)
        tl.fromTo(S + '.s02-sun-rise', { y: 70 },
          { y: -45, duration: 13.9, ease: 'sine.inOut' }, 0.6);
        tl.fromTo(S + '.s02-sun', { opacity: 0, scale: 0.82 },
          { opacity: 1, scale: 1, duration: 3.0, ease: 'sine.inOut' }, 0.9);
        tl.fromTo(S + '.s02-sun-halo', { opacity: 0.5 },
          { opacity: 0.85, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: rep(4.0, 2.4) }, 4.0);

        // water band fades in beneath the horizon, shimmer lines breathe staggered
        tl.fromTo(S + '.s02-water', { opacity: 0 },
          { opacity: 1, duration: 1.2, ease: 'power1.out' }, 1.6);
        const shimmers = document.querySelectorAll(S + '.s02-shimmer');
        shimmers.forEach((ln, i) => {
          const base = 0.12 + (i % 3) * 0.03;
          ln.style.opacity = base;
          const half = 3.2 + (i % 4) * 0.45;
          const start = 2.3 + i * 0.28;
          tl.fromTo(ln, { opacity: base },
            { opacity: base + 0.07, duration: half, ease: 'sine.inOut', yoyo: true, repeat: rep(start, half) }, start);
        });

        // sunset wash rises from 0 to 22% over 8s, then breathes gently
        tl.fromTo(S + '.s02-wash', { opacity: 0, y: 60 },
          { opacity: 0.22, y: 0, duration: 8.0, ease: 'sine.out' }, 2.0);
        tl.fromTo(S + '.s02-wash', { opacity: 0.22 },
          { opacity: 0.18, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: 1, immediateRender: false }, 10.05);

        // elevation hairlines: quick scaleX draws, then opacity breathe
        tl.fromTo(S + '.s02-hair-a', { scaleX: 0 },
          { scaleX: 1, duration: 0.9, ease: 'expo.out' }, 1.15);
        tl.fromTo(S + '.s02-hair-b', { scaleX: 0 },
          { scaleX: 1, duration: 0.7, ease: 'power3.out' }, 1.45);
        tl.fromTo(S + '.s02-hair-a', { opacity: 0.18 },
          { opacity: 0.10, duration: 2.8, ease: 'sine.inOut', yoyo: true, repeat: rep(2.4, 2.8), immediateRender: false }, 2.4);
        tl.fromTo(S + '.s02-hair-b', { opacity: 0.14 },
          { opacity: 0.08, duration: 3.4, ease: 'sine.inOut', yoyo: true, repeat: rep(2.7, 3.4), immediateRender: false }, 2.7);

        // waveform remnant: container breathes; bars flatten one by one into the horizon
        tl.fromTo(S + '.s02-wave-remnant', { opacity: 1 },
          { opacity: 0.78, duration: 2.0, ease: 'sine.inOut', yoyo: true, repeat: rep(0.4, 2.0) }, 0.4);
        bars.forEach((b, i) => {
          tl.fromTo(b, { scaleY: 1, opacity: 0.7 },
            { scaleY: 0.07, opacity: 0.4, duration: 0.25 + rnd() * 0.2, ease: 'power2.in' }, 4.0 + i * 0.7);
        });

        window.__timelines["s02"] = tl;
      })();
    </script>
  </div>
</template>
