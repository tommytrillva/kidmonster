    <script src="../vendor/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '#s04 ';
        const root = document.querySelector('#s04');
        const DUR = 16;
        // finite repeat count covering the remaining scene time
        const reps = (start, cycle) => Math.max(1, Math.ceil((DUR - start) / cycle)) - 1;

        // deterministic PRNG (mulberry32, seed 42)
        const mulberry32 = (s) => () => {
          s |= 0; s = (s + 0x6D2B79F5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const rng = mulberry32(42);

        // ---------- deterministic layout (canvas coords, 2000x1080) ----------
        const CX = [200, 467, 733, 1000, 1267, 1533, 1800];
        const CY = [600, 488, 568, 452, 596, 476, 556]; // gentle S-curve
        const nodes = root.querySelectorAll('.node');
        nodes.forEach((n, i) => {
          n.style.left = (CX[i] - 75) + 'px';
          n.style.top = (CY[i] - 60) + 'px';
        });

        // ---------- sea-spray particles ----------
        const spray = root.querySelector('.spray');
        const pdata = [];
        for (let i = 0; i < 9; i++) {
          const d = document.createElement('div');
          d.className = 'p-dot';
          const sz = 2 + Math.round(rng() * 1.4);
          d.style.left = (120 + rng() * 1680) + 'px';
          d.style.top = (220 + rng() * 740) + 'px';
          d.style.width = sz + 'px';
          d.style.height = sz + 'px';
          d.style.opacity = (0.12 + rng() * 0.12).toFixed(2);
          if (rng() > 0.55) d.style.background = '#35d0ba';
          spray.appendChild(d);
          pdata.push({ el: d, dx: 60 + rng() * 120, dy: 50 + rng() * 110 });
        }

        // ---------- cables (numeric bezier length, no getTotalLength) ----------
        const svg = root.querySelector('.cables');
        const NS = 'http://www.w3.org/2000/svg';
        const cubicLen = (p0, p1, p2, p3) => {
          let len = 0, px = p0[0], py = p0[1];
          for (let k = 1; k <= 32; k++) {
            const t = k / 32, u = 1 - t;
            const x = u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0];
            const y = u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1];
            len += Math.hypot(x - px, y - py);
            px = x; py = y;
          }
          return len;
        };
        const segPts = [], segLens = [], cablePaths = [];
        for (let i = 0; i < 6; i++) {
          const p0 = [CX[i] + 80, CY[i]], p3 = [CX[i + 1] - 80, CY[i + 1]];
          const p1 = [p0[0] + 95, p0[1]], p2 = [p3[0] - 95, p3[1]];
          segPts.push([p0, p1, p2, p3]);
          const L = cubicLen(p0, p1, p2, p3);
          segLens.push(L);
          const path = document.createElementNS(NS, 'path');
          path.setAttribute('d', 'M ' + p0[0] + ' ' + p0[1] + ' C ' + p1[0] + ' ' + p1[1] + ' ' + p2[0] + ' ' + p2[1] + ' ' + p3[0] + ' ' + p3[1]);
          path.setAttribute('class', 'cable');
          path.setAttribute('stroke-dasharray', L.toFixed(1));
          path.setAttribute('stroke-dashoffset', '0');
          svg.appendChild(path);
          cablePaths.push(path);
        }
        // combined pulse path (cables + straight runs under each node)
        let d = 'M ' + (CX[0] + 80) + ' ' + CY[0];
        let T = 0;
        const arrive = [0];
        for (let i = 0; i < 6; i++) {
          const sp = segPts[i];
          d += ' C ' + sp[1][0] + ' ' + sp[1][1] + ' ' + sp[2][0] + ' ' + sp[2][1] + ' ' + sp[3][0] + ' ' + sp[3][1];
          T += segLens[i];
          arrive.push(T);
          if (i < 5) {
            d += ' L ' + (CX[i + 1] + 80) + ' ' + CY[i + 1];
            T += 160;
          }
        }
        const DASH = 90;
        const mkPulse = (cls) => {
          const p = document.createElementNS(NS, 'path');
          p.setAttribute('d', d);
          p.setAttribute('class', cls);
          p.setAttribute('stroke-dasharray', DASH + ' ' + (T + DASH + 40).toFixed(1));
          p.setAttribute('stroke-dashoffset', String(DASH));
          svg.appendChild(p);
          return p;
        };
        const pulseGlow = mkPulse('pulse-glow');
        const pulseCore = mkPulse('pulse-core');

        // ---------- camera + BG ambient ----------
        tl.fromTo(S + '.cam', { x: 20 }, { x: -20, duration: 15.7, ease: 'power2.inOut' }, 0.3);
        tl.fromTo(S + '.dotgrid', { x: 0 }, { x: -34, duration: 15.7, ease: 'none' }, 0.3);
        tl.fromTo(S + '.glow-main',
          { opacity: 0.14, scale: 1 },
          { opacity: 0.24, scale: 1.07, duration: 2.6, ease: 'sine.inOut', yoyo: true, repeat: reps(0.3, 2.6) }, 0.3);
        tl.fromTo(S + '.glow-warm',
          { opacity: 0.08 },
          { opacity: 0.16, duration: 3.4, ease: 'sine.inOut', yoyo: true, repeat: reps(0.6, 3.4) }, 0.6);
        pdata.forEach((p) => {
          tl.fromTo(p.el, { x: 0, y: 0 }, { x: p.dx, y: -p.dy, duration: 15.4, ease: 'none' }, 0.4);
        });

        // ---------- node entrances (varied eases) + glyph bars + index ticks ----------
        const eases = ['expo.out', 'back.out(1.4)', 'power3.out'];
        nodes.forEach((n, i) => {
          const t = 0.8 + i * 0.45;
          tl.fromTo(n.querySelector('.drop'),
            { y: -90, scale: 0.85, opacity: 0 },
            { y: 0, scale: 1, opacity: 1, duration: 0.62, ease: eases[i % 3] }, t);
          tl.fromTo(n.querySelector('.glyph'),
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.4, ease: 'power2.out' }, t + 0.35);
          tl.fromTo(n.querySelector('.tick'),
            { scaleY: 0 },
            { scaleY: 1, duration: 0.25, ease: 'power3.out' }, t + 0.5);
        });
        // tick ambient blink (opacity only; transform stays on the entrance tween)
        tl.fromTo(S + '.tick',
          { opacity: 0.7 },
          { opacity: 0.3, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: reps(5.4, 1.4), stagger: 0.18 }, 5.4);

        // ---------- cables draw just-in-time (as the next node lands) ----------
        cablePaths.forEach((p, i) => {
          tl.fromTo(p,
            { attr: { 'stroke-dashoffset': segLens[i] } },
            { attr: { 'stroke-dashoffset': 0 }, duration: 0.55, ease: 'power2.inOut' }, 1.25 + i * 0.45);
        });

        // ---------- two full-pipeline pulses + node flare/lift ----------
        const runPulse = (t0, liftSel) => {
          tl.set([pulseGlow, pulseCore], { opacity: 1 }, t0);
          tl.fromTo(pulseGlow,
            { attr: { 'stroke-dashoffset': DASH } },
            { attr: { 'stroke-dashoffset': -T }, duration: 4, ease: 'none' }, t0);
          tl.fromTo(pulseCore,
            { attr: { 'stroke-dashoffset': DASH } },
            { attr: { 'stroke-dashoffset': -T }, duration: 4, ease: 'none' }, t0);
          tl.set([pulseGlow, pulseCore], { opacity: 0 }, t0 + 4.02);
          nodes.forEach((n, i) => {
            const at = t0 + 4 * Math.min(0.99, (arrive[i] + 70) / (T + DASH));
            tl.fromTo(n.querySelector(liftSel),
              { y: 0 },
              { y: -6, duration: 0.3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, at);
            tl.fromTo(n.querySelector('.flare'),
              { opacity: 0 },
              { opacity: 0.85, duration: 0.3, ease: 'sine.out', yoyo: true, repeat: 1 }, at);
          });
        };
        runPulse(6.0, '.lift-a');
        runPulse(11.0, '.lift-b');

        // ---------- per-icon idle motions (each one distinct) ----------
        // n1: squares blink in sequence
        tl.fromTo(S + '.n1 .sq',
          { opacity: 0.95 },
          { opacity: 0.4, duration: 0.8, ease: 'sine.inOut', yoyo: true, repeat: reps(4.4, 0.8), stagger: 0.2 }, 4.4);
        // n2: aperture slowly rotates
        tl.fromTo(S + '.n2 .ic-aperture',
          { rotation: 0 },
          { rotation: 150, duration: 11.6, ease: 'none' }, 4.4);
        // n3: twin circles breathe apart
        tl.fromTo(S + '.n3 .cir-a', { x: 0 }, { x: 4, duration: 1.7, ease: 'sine.inOut', yoyo: true, repeat: reps(4.4, 1.7) }, 4.4);
