    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '[data-composition-id="s11"] ';
        const D = 31; // local duration
        // finite repeat helper: cycles to (approximately) fill remaining time
        const rp = (t0, cyc) => Math.max(0, Math.ceil((D - t0) / cyc) - 1);
        // deterministic PRNG
        const rng = (seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296))(42);

        /* ---------- build BG spray dots (deterministic) ---------- */
        const sprayHost = document.querySelector(S + ".spray");
        const sprayDots = [];
        for (let i = 0; i < 14; i++) {
          const d = document.createElement("div");
          d.className = "sp";
          const sz = 2 + Math.round(rng() * 1);
          d.style.width = sz + "px";
          d.style.height = sz + "px";
          d.style.left = Math.round(rng() * 1880) + "px";
          d.style.top = Math.round(180 + rng() * 820) + "px";
          d.style.background = i % 2 === 0 ? "rgba(143, 224, 0, 0.85)" : "rgba(53, 208, 186, 0.85)";
          sprayHost.appendChild(d);
          sprayDots.push(d);
        }

        /* ---------- build dissolve particles (deterministic) ---------- */
        const dpHost = document.querySelector(S + ".dp-field");
        const dps = [];
        for (let i = 0; i < 20; i++) {
          const w = document.createElement("div");
          w.className = "dp-w";
          const px = Math.round(830 + rng() * 340);
          const py = Math.round(636 + rng() * 104);
          w.style.left = px + "px";
          w.style.top = py + "px";
          const c = document.createElement("div");
          c.className = "dp" + (i % 3 === 0 ? " gold" : "");
          w.appendChild(c);
          dpHost.appendChild(w);
          dps.push({ w, c, px, py, t0: 5.5 + rng() * 1.5, dur: 0.7 + rng() * 0.7 });
        }

        const SLOT = { x: 1040, y: 784 };

        /* =========================================================
           BG ambience (first motion at t = 0.3)
           ========================================================= */
        tl.fromTo(S + ".bg-dusk",
          { opacity: 0.7, scale: 1 },
          { opacity: 1, scale: 1.05, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: rp(0.3, 3.2) }, 0.3);
        tl.fromTo(S + ".bg-rim",
          { opacity: 0.6, scale: 1.04 },
          { opacity: 1, scale: 1, duration: 3.9, ease: "sine.inOut", yoyo: true, repeat: rp(0.3, 3.9) }, 0.3);
        tl.fromTo(S + ".horizon", { opacity: 0 }, { opacity: 0.18, duration: 1.1, ease: "sine.inOut" }, 0.4);
        tl.to(S + ".horizon", { opacity: 0.3, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: rp(1.6, 2.5) }, 1.6);
        // sea-spray dots drift up-right for the whole scene (one transform tween each)
        sprayDots.forEach((d, i) => {
          tl.fromTo(d,
            { x: 0, y: 0 },
            { x: 60 + rng() * 120, y: -(80 + rng() * 160), duration: 26 + rng() * 4, ease: "none" }, 0.4);
        });

        /* =========================================================
           Cassette enters from the left (t = 0.8, power2.inOut)
           ========================================================= */
        tl.fromTo(S + ".cas-enter",
          { x: -760, opacity: 0 },
          { x: 0, opacity: 1, duration: 1.4, ease: "power2.inOut" }, 0.8);
        // reels spin: finite repeats, ease none, only transform tween on each reel
        tl.fromTo(S + ".reel.r1",
          { rotation: 0 },
          { rotation: 360, duration: 1.1, ease: "none", repeat: Math.ceil((6.3 - 0.8) / 1.1) - 1 }, 0.8);
        tl.fromTo(S + ".reel.r2",
          { rotation: 0 },
          { rotation: -360, duration: 1.1, ease: "none", repeat: Math.ceil((6.3 - 0.8) / 1.1) - 1 }, 0.8);

        /* =========================================================
           Scanner powers up (t = 2.5)
           ========================================================= */
        tl.fromTo(S + ".scanner",
          { opacity: 0.55, scale: 0.985 },
          { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 2.5);
        tl.fromTo(S + ".scan-glow", { opacity: 0 }, { opacity: 0.5, duration: 0.8, ease: "power2.out" }, 2.5);
        tl.fromTo(S + ".scan-beam", { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power2.out" }, 2.5);
        // beam sweeps vertically inside the arch (finite yoyo, ends at the dark beat)
        tl.fromTo(S + ".scan-beam",
          { y: 0 },
          { y: 210, duration: 0.95, ease: "sine.inOut", yoyo: true, repeat: Math.ceil((8.2 - 2.5) / 0.95) - 1 }, 2.5);
        tl.fromTo(S + ".slot-glow", { opacity: 0 }, { opacity: 0.4, duration: 0.6, ease: "power2.out" }, 2.7);
        // sprocket dots blink (staggered ambient, finite)
        for (let i = 0; i < 5; i++) {
          const t0 = 3.0 + i * 0.22;
          tl.to(S + ".spk.k" + (i + 1),
            { opacity: 0.7, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: rp(t0, 1.1) }, t0);
        }

        /* =========================================================
           Cassette slides into the scanner (t = 4.0 - 5.5)
           ========================================================= */
        tl.fromTo(S + ".cas-slide",
          { x: 0, scale: 1 },
          { x: 552, scale: 0.8, duration: 1.5, ease: "power2.inOut" }, 4.0);

        /* =========================================================
           Mid-scene morph: cassette dissolves into ~20 particles
           funneling into the slot (t = 5.5 - 8.4), then hard-kill
           ========================================================= */
        tl.fromTo(S + ".cassette", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power1.in" }, 5.5);
        tl.set(S + ".cas-enter", { opacity: 0, visibility: "hidden" }, 6.4);
        dps.forEach((p) => {
          // curve = wrapper x (one ease) + child y (another ease); one transform tween per element
          tl.fromTo(p.w, { x: 0 }, { x: SLOT.x - p.px, duration: p.dur, ease: "power1.in" }, p.t0);
          tl.fromTo(p.c, { y: 0 }, { y: SLOT.y - p.py, duration: p.dur, ease: "power2.in" }, p.t0);
          tl.fromTo(p.c, { opacity: 0 }, { opacity: 0.9, duration: 0.18, ease: "power2.out" }, p.t0);
          tl.to(p.c, { opacity: 0, duration: 0.16, ease: "power1.in" }, p.t0 + p.dur - 0.16);
        });
        tl.set(S + ".dp-field", { opacity: 0, visibility: "hidden" }, 8.6);
        // slot drinks the light as particles arrive
        tl.to(S + ".slot-glow", { opacity: 0.85, duration: 1.6, ease: "sine.inOut" }, 6.0);

        /* =========================================================
           Beat of dark (t = 8.2 - 8.9), then re-ignition
           ========================================================= */
        tl.to(S + ".scan-glow", { opacity: 0.12, duration: 0.35, ease: "power1.in" }, 8.2);
        tl.to(S + ".scan-beam", { opacity: 0.1, duration: 0.35, ease: "power1.in" }, 8.2);
        tl.to(S + ".slot-glow", { opacity: 0.1, duration: 0.3, ease: "power1.in" }, 8.25);
        tl.to(S + ".scan-glow", { opacity: 0.55, duration: 0.25, ease: "power3.out" }, 8.85);
        tl.to(S + ".scan-glow", { opacity: 0.3, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: rp(10, 1.5) }, 10);
        tl.to(S + ".scan-beam", { opacity: 0.35, duration: 1.75, ease: "sine.inOut", yoyo: true, repeat: rp(10, 1.75) }, 10);

        /* =========================================================
           Memory frames erupt one-by-one from the slot (t = 9.2 - 18.6)
           launch + settle in a single fromTo per wrapper (expo.out)
           ========================================================= */
        const CARDS = [
          { w: S + ".m1-w", kb: S + ".kb1", st: S + ".st1", cx: 360,  cy: 565, tilt: -5, t: 9.2 },
          { w: S + ".m2-w", kb: S + ".kb2", st: S + ".st2", cx: 590,  cy: 395, tilt: 3,  t: 10.8 },
          { w: S + ".m3-w", kb: S + ".kb3", st: S + ".st3", cx: 855,  cy: 300, tilt: -2, t: 12.4 },
          { w: S + ".m4-w", kb: S + ".kb4", st: S + ".st4", cx: 1145, cy: 310, tilt: 4,  t: 14.0 },
          { w: S + ".m5-w", kb: S + ".kb5", st: S + ".st5", cx: 1415, cy: 420, tilt: -3, t: 15.6 },
          { w: S + ".m6-w", kb: S + ".kb6", st: S + ".st6", cx: 1625, cy: 590, tilt: 5,  t: 17.2 },
        ];
        CARDS.forEach((c, i) => {
          const tilt0 = (rng() * 36 - 18);
          // slot flare as the frame launches (opacity-only tweens)
          tl.to(S + ".slot-glow", { opacity: 1, duration: 0.12, ease: "power3.out" }, c.t - 0.1);
          tl.to(S + ".slot-glow", { opacity: 0.4, duration: 0.5, ease: "power1.in" }, c.t + 0.05);
          // launch from slot, settle into arc spot (single transform tween on wrapper)
          tl.fromTo(c.w,
            { x: SLOT.x - c.cx, y: SLOT.y - c.cy, scale: 0.3, rotation: tilt0, opacity: 0 },
            { x: 0, y: 0, scale: 1, rotation: c.tilt, opacity: 1, duration: 1.4, ease: "expo.out" }, c.t);
          // halo blooms, then breathes (entrance fromTo, then opacity-only pulse)
          tl.fromTo(c.w + " .mem-halo",
            { opacity: 0, scale: 0.85 },
            { opacity: 0.5, scale: 1, duration: 0.6, ease: "power2.out" }, c.t + 0.15);
          tl.to(c.w + " .mem-halo",
            { opacity: 0.24, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: rp(c.t + 0.85, 1.3) }, c.t + 0.85);
          // Ken Burns on the child layer (its only transform tween, alternating direction)
          const kbStart = c.t + 1.4;
          if (i % 2 === 0) {
            tl.fromTo(c.kb, { scale: 1 }, { scale: 1.07, duration: D - kbStart, ease: "none" }, kbStart);
          } else {
            tl.fromTo(c.kb, { scale: 1.08 }, { scale: 1.01, duration: D - kbStart, ease: "none" }, kbStart);
          }
          // light stream draws slot -> frame as it lands
          tl.fromTo(c.st,
            { strokeDashoffset: 1400 },
            { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, c.t + 0.35);
        });

        /* =========================================================
           Final third (t = 20 - 31): constellation breathes,
           camera drifts, warm bleed maxes at 25%. No exits.
           ========================================================= */
        tl.fromTo(S + ".cam",
          { x: 0 },
          { x: -34, duration: 10.5, ease: "sine.inOut" }, 20);
        tl.fromTo(S + ".constellation",
          { scale: 1 },
          { scale: 1.015, duration: 2.75, ease: "sine.inOut", yoyo: true, repeat: 3 }, 20);
        tl.to(S + ".streams",
          { opacity: 0.3, duration: 1.83, ease: "sine.inOut", yoyo: true, repeat: Math.ceil((D - 20) / 1.83) - 1 }, 20);
        tl.to(S + ".slot-glow",
          { opacity: 0.6, duration: 1.375, ease: "sine.inOut", yoyo: true, repeat: Math.ceil((D - 20) / 1.375) - 1 }, 20);
        tl.fromTo(S + ".warm-bleed",
          { opacity: 0 },
          { opacity: 0.25, duration: 7, ease: "sine.inOut" }, 18);

        window.__timelines["s11"] = tl;
      })();
    </script>
  </div>
</template>
