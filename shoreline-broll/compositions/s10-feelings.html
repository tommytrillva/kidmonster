        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '[data-composition-id="s10"] ';
        const DUR = 34;
        const root = document.querySelector('[data-composition-id="s10"]');
        const rng = (seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296))(42);
        const reps = (start, cycle) => Math.max(0, Math.ceil((DUR - start) / cycle) - 1);

        /* ---------- synchronous DOM generation (before any tween) ---------- */

        // sea-spray particles
        const pField = root.querySelector('.particles');
        const pCols = [
          'rgba(143, 224, 0, 0.45)',
          'rgba(53, 208, 186, 0.45)',
          'rgba(255, 198, 92, 0.40)'
        ];
        const dots = [];
        for (let i = 0; i < 14; i++) {
          const d = document.createElement('div');
          d.className = 'pdot';
          const sz = 2 + Math.round(rng() * 1.4);
          d.style.width = sz + 'px';
          d.style.height = sz + 'px';
          d.style.left = Math.round(60 + rng() * 1800) + 'px';
          d.style.top = Math.round(120 + rng() * 880) + 'px';
          d.style.background = pCols[i % 3];
          d.style.opacity = (0.12 + rng() * 0.13).toFixed(2);
          pField.appendChild(d);
          dots.push(d);
        }

        // film-strip sprocket holes (9 top + 9 bottom)
        root.querySelectorAll('.sprockets').forEach(row => {
          for (let i = 0; i < 9; i++) {
            const h = document.createElement('div');
            h.className = 'hole';
            row.appendChild(h);
          }
        });

        // warm-grain speckles
        const speckBox = root.querySelector('.grain-speck');
        const sCols = [
          'rgba(255, 198, 92, 0.55)',
          'rgba(255, 100, 115, 0.40)',
          'rgba(234, 245, 226, 0.30)'
        ];
        for (let i = 0; i < 48; i++) {
          const s = document.createElement('div');
          s.className = 'speck';
          const sz = 2 + Math.round(rng());
          s.style.width = sz + 'px';
          s.style.height = sz + 'px';
          s.style.left = Math.round(8 + rng() * 264) + 'px';
          s.style.top = Math.round(8 + rng() * 336) + 'px';
          s.style.background = sCols[i % 3];
          speckBox.appendChild(s);
        }

        // thread paths: prime dash state synchronously
        const threadEls = Array.from(root.querySelectorAll('.thread'));
        const threadLens = threadEls.map(p => {
          let L = 1600;
          try { L = Math.ceil(p.getTotalLength()) + 4; } catch (e) { /* fallback */ }
          if (!L || L < 10) L = 1600;
          p.style.strokeDasharray = String(L);
          p.style.strokeDashoffset = String(L);
          return L;
        });

        /* ---------- BG ambient (t >= 0.3) ---------- */

        tl.fromTo(S + '.glow-warm-wrap', { opacity: 0 }, { opacity: 1, duration: 2.4, ease: 'sine.out' }, 0.3);
        tl.fromTo(S + '.glow-warm', { scale: 1 },
          { scale: 1.08, duration: 4, yoyo: true, repeat: reps(2, 4), ease: 'sine.inOut' }, 2);

        tl.fromTo(S + '.glow-green-wrap', { opacity: 0 }, { opacity: 1, duration: 2.6, ease: 'sine.out' }, 0.5);
        tl.fromTo(S + '.glow-green', { scale: 1 },
          { scale: 1.06, duration: 6.4, yoyo: true, repeat: reps(2, 6.4), ease: 'sine.inOut' }, 2);

        dots.forEach((d, i) => {
          const start = 0.4 + rng() * 1.2;
          const cyc = 4 + rng() * 2;
          tl.fromTo(d, { x: 0, y: 0 }, {
            x: 26 + rng() * 46,
            y: -(36 + rng() * 56),
            duration: cyc,
            yoyo: true,
            repeat: reps(start, cyc),
            ease: 'sine.inOut'
          }, start);
        });

        tl.fromTo(S + '.horizon', { opacity: 0, scaleX: 0.85 },
          { opacity: 0.15, scaleX: 1, duration: 1.6, ease: 'power2.out' }, 0.6);
        tl.to(S + '.horizon',
          { opacity: 0.08, duration: 3.2, yoyo: true, repeat: reps(3, 3.2), ease: 'sine.inOut' }, 3);

        /* ---------- board breathes in ---------- */

        tl.fromTo(S + '.board', { opacity: 0, scale: 0.97 },
          { opacity: 1, scale: 1, duration: 1.2, ease: 'sine.out' }, 0.5);
        tl.to(S + '.board-glow',
          { opacity: 0.5, duration: 3, yoyo: true, repeat: reps(2, 3), ease: 'sine.inOut' }, 2);

        const ticks = root.querySelectorAll('.tick');
        tl.fromTo(ticks, { opacity: 0 },
          { opacity: 0.55, duration: 0.25, ease: 'power2.out', stagger: 0.08 }, 1.1);
        tl.to(ticks,
          { opacity: 0.3, duration: 2.6, yoyo: true, repeat: reps(4, 2.6), ease: 'sine.inOut' }, 4);

        tl.fromTo(S + '.board-tag', { opacity: 0, y: -18 },
          { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 1.15);
        tl.to(S + '.board-tag .gbar',
          { opacity: 0.35, duration: 3, yoyo: true, repeat: reps(5, 3), ease: 'sine.inOut' }, 5);

        /* ---------- card entrances: 7 distinct verbs (t = 1.5 .. ~10.8) ---------- */

        // 1. VHS swatch SLIDES (expo.out)
        tl.fromTo(S + '.c-vhs', { opacity: 0, x: -180 },
          { opacity: 1, x: 0, duration: 0.8, ease: 'expo.out' }, 1.5);

        // 2. film strip UNROLLS scaleX from left (power3.out)
        tl.fromTo(S + '.c-film', { opacity: 0, scaleX: 0, transformOrigin: 'left center' },
          { opacity: 1, scaleX: 1, duration: 0.9, ease: 'power3.out' }, 2.9);

        // 3. sunset card BLOOMS from blur (power2.out)
        tl.fromTo(S + '.c-sunset', { opacity: 0, scale: 1.06, filter: 'blur(18px)' },
          { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 1.1, ease: 'power2.out' }, 4.3);

        // 4. night card FADES from dark (sine.out) + veil lifts then hard-kills
        tl.fromTo(S + '.c-night', { opacity: 0 },
          { opacity: 1, duration: 1.3, ease: 'sine.out' }, 5.7);
        tl.fromTo(S + '.night-veil', { opacity: 1 },
          { opacity: 0, duration: 2.2, ease: 'sine.inOut' }, 5.9);
        tl.set(S + '.night-veil', { opacity: 0, visibility: 'hidden' }, 8.2);

        // 5. headlight card STREAKS in fast (expo.out, x + skew in ONE tween)
        tl.fromTo(S + '.c-head', { opacity: 0, x: 340, skewX: -8 },
          { opacity: 1, x: 0, skewX: 0, duration: 0.45, ease: 'expo.out' }, 7.1);

        // 6. silhouette card DRIFTS up (sine.out)
        tl.fromTo(S + '.c-sil', { opacity: 0, y: 90 },
          { opacity: 1, y: 0, duration: 1.2, ease: 'sine.out' }, 8.5);

        // 7. grain swatch SETTLES with rotation (back.out)
        tl.fromTo(S + '.c-grain', { opacity: 0, rotation: -6, scale: 1.08 },
          { opacity: 1, rotation: 0, scale: 1, duration: 0.9, ease: 'back.out(1.4)' }, 9.9);

        // soft glow ring on each landing (appear -> fade -> deterministic kill)
        const lands = [
          ['.c-vhs .ring', 2.3], ['.c-film .ring', 3.8], ['.c-sunset .ring', 5.4],
          ['.c-night .ring', 7.0], ['.c-head .ring', 7.55], ['.c-sil .ring', 9.7],
          ['.c-grain .ring', 10.8]
        ];
        lands.forEach(([sel, t]) => {
          tl.fromTo(S + sel, { opacity: 0, scale: 0.85 },
            { opacity: 0.9, scale: 1.1, duration: 0.45, ease: 'power3.out' }, t);
          tl.to(S + sel, { opacity: 0, duration: 0.7, ease: 'sine.in' }, t + 0.5);
          tl.set(S + sel, { opacity: 0, visibility: 'hidden' }, t + 1.25);
        });

        /* ---------- card inner-life ambients (opacity only, finite) ---------- */

        tl.to(S + '.vhs-shimmer',
          { opacity: 0.12, duration: 2.8, yoyo: true, repeat: reps(3, 2.8), ease: 'sine.inOut' }, 3);
        tl.to(S + '.sun-glow',
          { opacity: 0.55, duration: 3.4, yoyo: true, repeat: reps(6, 3.4), ease: 'sine.inOut' }, 6);
        tl.to(S + '.beam-a',
          { opacity: 0.5, duration: 2.2, yoyo: true, repeat: reps(8.2, 2.2), ease: 'sine.inOut' }, 8.2);
        tl.to(S + '.beam-b',
          { opacity: 0.45, duration: 2.6, yoyo: true, repeat: reps(8.6, 2.6), ease: 'sine.inOut' }, 8.6);

        /* ---------- palette column arrives (t = 12) ---------- */

        tl.fromTo(S + '.palette', { opacity: 0, x: 90 },
          { opacity: 1, x: 0, duration: 0.9, ease: 'power3.out' }, 12);
        tl.fromTo(S + '.pbar', { opacity: 0 },
          { opacity: 0.55, duration: 0.4, ease: 'power2.out', stagger: 0.12 }, 12.6);

        /* ---------- threads draw + swatch pills fill (t = 14 .. ~22) ---------- */

        const tDraw = [14, 15.6, 17.2, 18.8, 20.4];
        threadEls.forEach((p, i) => {
          tl.fromTo(p, { strokeDashoffset: threadLens[i] },
            { strokeDashoffset: 0, duration: 1.3, ease: 'power2.inOut' }, tDraw[i]);
        });

        const fills = ['.fill-gold', '.fill-orange', '.fill-rose', '.fill-teal', '.fill-green'];
        const fillEases = ['expo.out', 'power3.out', 'expo.out', 'power2.out', 'power3.out'];
        fills.forEach((sel, i) => {
          tl.fromTo(S + sel, { scaleX: 0, transformOrigin: 'left center' },
            { scaleX: 1, duration: 0.7, ease: fillEases[i] }, tDraw[i] + 0.9);
        });

        // palette pulses softly + threads shimmer once everything is connected
        tl.to(S + '.palette-glow',
          { opacity: 0.55, duration: 1.6, yoyo: true, repeat: reps(22.5, 1.6), ease: 'sine.inOut' }, 22.5);
        tl.to(threadEls,
          { opacity: 0.32, duration: 2.4, yoyo: true, repeat: reps(22, 2.4), ease: 'sine.inOut' }, 22);

        /* ---------- cursor pass over the board (t = 16.6 .. 21.5) ---------- */

        tl.fromTo(S + '.cursor', { opacity: 0 }, { opacity: 0.9, duration: 0.4, ease: 'sine.out' }, 16.6);
        tl.fromTo(S + '.cursor', { x: 0, y: 0 },
          { x: 800, y: -510, duration: 4.4, ease: 'power2.inOut' }, 16.8);
        tl.to(S + '.cursor', { opacity: 0, duration: 0.5, ease: 'power1.in' }, 21);
        tl.set(S + '.cursor', { opacity: 0, visibility: 'hidden' }, 21.5);

        /* ---------- final 8s: parallax sweep + micro-floats (t = 25 .. 34) ---------- */

        tl.fromTo(S + '.tilt', { rotationY: -2 },
          { rotationY: 2, duration: 8, ease: 'sine.inOut' }, 25);

        const floats = [
          ['.c-vhs', 5, 3], ['.c-film', -4, 2.25], ['.c-sunset', 6, 1.8],
          ['.c-night', -5, 3], ['.c-head', 4, 2.25], ['.c-sil', -6, 1.8],
          ['.c-grain', 5, 3]
        ];
        floats.forEach(([sel, amp, cyc]) => {
          tl.fromTo(S + sel + ' .card-float', { y: 0 }, {
            y: amp,
            duration: cyc,
            yoyo: true,
            repeat: Math.ceil(9 / cyc) - 1,
            ease: 'sine.inOut'
          }, 25);
        });

        window.__timelines["s10"] = tl;
      })();
    </script>
  </div>
</template>
