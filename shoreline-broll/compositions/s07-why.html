    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '[data-composition-id="s07"] ';
        const root = document.querySelector('[data-composition-id="s07"]');
        const rng = (seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296))(42);
        const SCENE_END = 25;
        const reps = (start, cycle) => Math.max(0, Math.ceil((SCENE_END - start) / cycle) - 1);

        /* =========================================================
         * BUILD (synchronous, deterministic) — chaos board layout
         * ========================================================= */

        // --- grid lines ---
        const gridInner = root.querySelector(".s07-grid-inner");
        for (let i = 0; i < 7; i++) {
          const v = document.createElement("div");
          v.className = "s07-grid-line";
          v.style.left = (130 + i * 280) + "px";
          v.style.top = "0px";
          v.style.width = "2px";
          v.style.height = "1180px";
          gridInner.appendChild(v);
        }
        for (let i = 0; i < 4; i++) {
          const h = document.createElement("div");
          h.className = "s07-grid-line";
          h.style.left = "0px";
          h.style.top = (170 + i * 250) + "px";
          h.style.width = "2010px";
          h.style.height = "2px";
          gridInner.appendChild(h);
        }

        // --- 22 note bubbles on a jittered 6x4 cell grid ---
        const cells = [];
        for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) cells.push([c, r]);
        for (let i = cells.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          const t = cells[i]; cells[i] = cells[j]; cells[j] = t;
        }
        const bubblesHost = root.querySelector(".s07-bubbles");
        const bubData = [];
        for (let i = 0; i < 22; i++) {
          const c = cells[i][0], r = cells[i][1];
          const cx = 70 + c * 296 + 148 + (rng() * 120 - 60);
          const cy = 60 + r * 240 + 120 + (rng() * 90 - 45);
          const w = 110 + rng() * 110;
          const h = 50 + rng() * 58;
          const rot = rng() * 16 - 8;

          const wrap = document.createElement("div");
          wrap.className = "s07-bub-wrap";
          wrap.style.left = (cx - w / 2) + "px";
          wrap.style.top = (cy - h / 2) + "px";
          wrap.style.width = w + "px";
          wrap.style.height = h + "px";

          const bub = document.createElement("div");
          bub.className = "s07-bub" + (i % 4 === 0 ? " s07-bub-rose" : "");
          const nBars = h > 78 ? 3 : 2;
          for (let b = 0; b < nBars; b++) {
            const bar = document.createElement("div");
            bar.className = "s07-bar" +
              (i % 4 === 0 && b === 0 ? " s07-bar-rose" : (b === nBars - 1 && i % 3 === 1 ? " s07-bar-acc" : ""));
            bar.style.width = Math.round(45 + rng() * 48) + "%";
            bub.appendChild(bar);
          }
          if (i % 3 === 0) {
            const pin = document.createElement("span");
            pin.className = "s07-pin";
            bub.appendChild(pin);
          }
          wrap.appendChild(bub);
          bubblesHost.appendChild(wrap);
          bubData.push({ wrap, bub, cx, cy, w, h, rot });
        }

        // --- 8 arrow connectors between bubble centers ---
        const arrowsHost = root.querySelector(".s07-arrows");
        const arrows = [];
        let guard = 0;
        while (arrows.length < 8 && guard < 300) {
          guard++;
          const a = Math.floor(rng() * 22), b = Math.floor(rng() * 22);
          if (a === b) continue;
          const dx = bubData[b].cx - bubData[a].cx;
          const dy = bubData[b].cy - bubData[a].cy;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < 230 || d > 880) continue;
          const ang = Math.atan2(dy, dx) * 180 / Math.PI;
          const el = document.createElement("div");
          el.className = "s07-arrow";
          el.style.left = bubData[a].cx + "px";
          el.style.top = bubData[a].cy + "px";
          el.style.width = d + "px";
          el.style.transformOrigin = "0 50%";
          const rose = arrows.length % 3 === 0;
          el.style.background = rose ? "rgba(255, 100, 115, 0.55)" : "rgba(62, 142, 14, 0.85)";
          const head = document.createElement("span");
          head.className = "s07-arrow-head";
          head.style.borderLeft = "10px solid " + (rose ? "rgba(255, 100, 115, 0.7)" : "rgba(143, 224, 0, 0.7)");
          el.appendChild(head);
          arrowsHost.appendChild(el);
          arrows.push({ el, ang });
        }

        // --- 5 anxious alert dots pinned near bubbles ---
        const dotsHost = root.querySelector(".s07-dots");
        const alertDots = [];
        for (let i = 0; i < 5; i++) {
          const bd = bubData[i * 4 + 1];
          const el = document.createElement("div");
          el.className = "s07-alert";
          el.style.left = (bd.cx + bd.w / 2 - 10 + (rng() * 14 - 7)) + "px";
          el.style.top = (bd.cy - bd.h / 2 - 8 + (rng() * 10 - 5)) + "px";
          dotsHost.appendChild(el);
          alertDots.push(el);
        }

        // --- 3 glitch slice bars ---
        const slicesHost = root.querySelector(".s07-slices");
        const slices = [];
        for (let i = 0; i < 3; i++) {
          const el = document.createElement("div");
          el.className = "s07-slice";
          el.style.top = Math.round(90 + rng() * 880) + "px";
          slicesHost.appendChild(el);
          slices.push(el);
        }

        /* =========================================================
         * TIMELINE — local 0..25s
         * ========================================================= */

        // ---- BG settles in (first tween at t=0.4) ----
        tl.fromTo(S + ".s07-grid", { opacity: 0 }, { opacity: 0.18, duration: 1.2, ease: "sine.out" }, 0.4);
        tl.fromTo(S + ".s07-grid-inner", { x: -16 }, { x: 16, duration: 9.0, ease: "sine.inOut" }, 0.4);
        tl.fromTo(S + ".s07-glow-green", { opacity: 0 }, { opacity: 0.5, duration: 1.6, ease: "sine.out" }, 0.4);
        tl.fromTo(S + ".s07-glow-green",
          { scale: 1 },
          { scale: 1.08, duration: 2.7, ease: "sine.inOut", yoyo: true, repeat: reps(0.4, 2.7) }, 0.4);
        tl.fromTo(S + ".s07-glow-rose", { opacity: 0 }, { opacity: 0.55, duration: 1.4, ease: "sine.out" }, 0.7);
        tl.fromTo(S + ".s07-glow-rose",
          { scale: 1 },
          { scale: 1.1, duration: 1.9, ease: "sine.inOut", yoyo: true, repeat: Math.ceil((9.4 - 0.7) / 1.9) - 1 }, 0.7);

        // ---- Chaos: bubbles pile on with ACCELERATING stagger (0.4s -> 0.08s) ----
        const eases = ["back.out(1.8)", "expo.out", "power3.out"];
        let tBub = 0.55;
        let gap = 0.4;
        bubData.forEach((bd, i) => {
          tl.fromTo(bd.wrap,
            { opacity: 0, scale: 0.45, y: 46, rotation: bd.rot },
            { opacity: 1, scale: 1, y: 0, rotation: bd.rot, duration: 0.28 + rng() * 0.25, ease: eases[i % 3] },
            tBub);
          tBub += gap;
          gap = Math.max(0.08, gap * 0.92);
        });

        // slow claustrophobic creep on the whole board
        tl.fromTo(S + ".s07-chaos-scale", { scale: 1 }, { scale: 1.035, duration: 7.4, ease: "sine.inOut" }, 0.6);

        // ---- Arrows scribble across (angled scaleX draws) ----
        arrows.forEach((a, i) => {
          tl.fromTo(a.el,
            { opacity: 0, scaleX: 0, rotation: a.ang },
            { opacity: 0.75, scaleX: 1, rotation: a.ang, duration: 0.32, ease: "power1.in" },
            3.3 + i * 0.4);
        });
        // anxious group flicker on the connectors
        tl.to(S + ".s07-arrows", { opacity: 0.55, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7 }, 7.0);

        // ---- Alert dots: pop in, then anxiety-tempo pulse (0.4s cycle) ----
        alertDots.forEach((el, i) => {
          const tIn = 4.5 + i * 0.42;
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power3.out" }, tIn);
          const tp = tIn + 0.2;
          tl.to(el, { scale: 1.55, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: Math.ceil((9.4 - tp) / 0.2) - 1 }, tp);
        });

        // ---- t=8: full-board GLITCH (x-jitter steps + slice flickers) ----
        tl.to(S + ".s07-chaos-jitter", {
          keyframes: [
            { x: -16, duration: 0.1 }, { x: 11, duration: 0.09 }, { x: -8, duration: 0.11 },
            { x: 14, duration: 0.08 }, { x: -18, duration: 0.1 }, { x: 7, duration: 0.09 },
            { x: -11, duration: 0.1 }, { x: 15, duration: 0.08 }, { x: 0, duration: 0.12 }
          ],
          ease: "none"
        }, 8.0);
        slices.forEach((el, i) => {
          tl.to(el, {
            keyframes: [
              { opacity: 0.3, duration: 0.07 }, { opacity: 0, duration: 0.1 },
              { opacity: 0.22, duration: 0.06 }, { opacity: 0, duration: 0.12 },
              { opacity: 0.28, duration: 0.07 }, { opacity: 0, duration: 0.1 }
            ],
            ease: "none"
          }, 8.05 + i * 0.18);
        });

        // ---- t=9.4: the chaos DRAINS downward (bottom-up bubble cascade + wrapper sink) ----
        const drainOrder = bubData.slice().sort((a, b) => b.cy - a.cy);
        drainOrder.forEach((bd, i) => {
          tl.to(bd.bub, { y: 70, opacity: 0, duration: 0.5, ease: "power1.in" }, 9.4 + i * 0.032);
        });
        tl.to(S + ".s07-chaos-drain", { y: 60, opacity: 0, duration: 1.1, ease: "power2.in" }, 9.5);
        tl.to(S + ".s07-grid", { opacity: 0, duration: 0.9, ease: "sine.in" }, 9.4);
        tl.to(S + ".s07-glow-rose", { opacity: 0, duration: 0.9, ease: "sine.in" }, 9.4);
        // hard-kill after the mid-scene fade-out (contract rule 16)
        tl.set([S + ".s07-chaos-drain", S + ".s07-grid", S + ".s07-glow-rose"], { opacity: 0, visibility: "hidden" }, 10.7);
