    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '[data-composition-id="s05"] ';
        const DUR = 22;
        const rep = (t0, d) => Math.max(0, Math.ceil((DUR - t0) / d) - 1);

        // deterministic PRNG (mulberry32, seed 42)
        const mulberry32 = (a) => () => {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const rng = mulberry32(42);

        const root = document.querySelector('[data-composition-id="s05"]');

        // ---------- build: BG ruler ticks ----------
        const ruler = root.querySelector(".s05-ruler");
        for (let i = 0; i < 59; i++) {
          const t = document.createElement("div");
          t.className = "s05-rtick";
          t.style.left = (i * 30) + "px";
          t.style.height = (i % 4 === 0 ? 12 : 7) + "px";
          ruler.appendChild(t);
        }

        // ---------- build: sea-spray dots ----------
        const spray = root.querySelector(".s05-spray");
        const dots = [];
        for (let i = 0; i < 14; i++) {
          const d = document.createElement("div");
          d.className = "s05-dot";
          const sz = 2 + Math.round(rng() * 1);
          d.style.width = sz + "px";
          d.style.height = sz + "px";
          d.style.left = Math.round(60 + rng() * 1800) + "px";
          d.style.top = Math.round(60 + rng() * 960) + "px";
          d.style.background = i % 3 === 0
            ? "rgba(53, 208, 186, 0.50)"
            : "rgba(143, 224, 0, 0.45)";
          spray.appendChild(d);
          dots.push(d);
        }

        // ---------- build: track header rows ----------
        const header = root.querySelector(".s05-header");
        const laneTops = [0, 86, 172, 258, 344]; // 4 video lanes + 1 audio lane (within .s05-lanes)
        const laneHts = [72, 72, 72, 72, 64];
        const iconKinds = ["square", "circle", "diamond", "square", "bars"];
        for (let i = 0; i < 5; i++) {
          const row = document.createElement("div");
          row.className = "s05-hrow";
          row.style.top = laneTops[i] + "px";
          row.style.height = laneHts[i] + "px";
          const icon = document.createElement("div");
          icon.className = "s05-hicon";
          if (iconKinds[i] === "bars") {
            const wrap = document.createElement("div");
            wrap.className = "s05-ic-bars";
            for (let b = 0; b < 4; b++) {
              const ib = document.createElement("div");
              ib.className = "s05-ic-bar";
              ib.style.height = [40, 80, 55, 95][b] + "%";
              wrap.appendChild(ib);
            }
            icon.appendChild(wrap);
          } else {
            const sh = document.createElement("div");
            sh.className = "s05-ic-" + iconKinds[i];
            icon.appendChild(sh);
          }
          const gl = document.createElement("div");
          gl.className = "s05-hglyphs";
          for (let g = 0; g < 2; g++) {
            const bar = document.createElement("div");
            bar.className = "s05-gbar";
            bar.style.width = Math.round(60 + rng() * 60) + "px";
            gl.appendChild(bar);
          }
          row.appendChild(icon);
          row.appendChild(gl);
          header.appendChild(row);
        }

        // ---------- build: lane strips ----------
        const lanes = root.querySelector(".s05-lanes");
        const laneEls = [];
        for (let i = 0; i < 5; i++) {
          const ln = document.createElement("div");
          ln.className = "s05-lane" + (i === 4 ? " s05-lane-audio" : "");
          ln.style.top = laneTops[i] + "px";
          lanes.appendChild(ln);
          laneEls.push(ln);
        }

        // ---------- build: audio bars in lane 5 ----------
        const audioLane = laneEls[4];
        const abars = [];
        const nBars = 122;
        for (let i = 0; i < nBars; i++) {
          const b = document.createElement("div");
          b.className = "s05-abar" + (i % 5 === 0 ? " s05-abar-t" : "");
          b.style.left = (10 + i * 12) + "px";
          b.style.height = Math.round(8 + rng() * 42) + "px";
          audioLane.appendChild(b);
          abars.push(b);
        }

        // ---------- build: clip blocks + beat ticks on a 0.75s grid ----------
        const clipsLayer = root.querySelector(".s05-clips");
        const rulerStrip = root.querySelector(".s05-rulerstrip");
        const BEAT0 = 2.5;
        const BEAT = 0.75;
        const laneOrder = [0, 2, 1, 3, 1, 0, 3, 2, 0, 1, 2, 3, 1]; // 13 clips
        const cursors = [0, 26, 64, 12];
        const clips = [];
        for (let i = 0; i < laneOrder.length; i++) {
          const lane = laneOrder[i];
          const w = 150 + Math.round(rng() * 26) * 7;
          const c = document.createElement("div");
          c.className = "s05-clip s05-cg" + (i % 3);
          c.style.left = cursors[lane] + "px";
          c.style.top = (laneTops[lane] + 8) + "px";
          c.style.width = w + "px";
          const tag = document.createElement("div");
          tag.className = "s05-clip-tag";
          tag.style.width = Math.round(28 + rng() * 30) + "px";
          c.appendChild(tag);
          const fl = document.createElement("div");
          fl.className = "s05-cflash";
          c.appendChild(fl);
          clipsLayer.appendChild(c);

          const bt = document.createElement("div");
          bt.className = "s05-btick";
          bt.style.left = Math.round(cursors[lane] + w / 2) + "px";
          rulerStrip.appendChild(bt);

          clips.push({ el: c, flash: fl, tick: bt, beat: BEAT0 + i * BEAT });
          cursors[lane] += w + 14;
        }

        // ---------- build: montage wall cards ----------
        const wall = root.querySelector(".s05-mwall");
        const mcards = [];
        const mglows = [];
        for (let i = 0; i < 12; i++) {
          const card = document.createElement("div");
          card.className = "s05-mcard s05-mg" + (i % 3);
          const hz = document.createElement("div");
          hz.className = "s05-mc-horizon";
          hz.style.top = Math.round(52 + rng() * 18) + "%";
          card.appendChild(hz);
          const gw = document.createElement("div");
          gw.className = "s05-mc-glow";
          card.appendChild(gw);
          wall.appendChild(card);
          mcards.push(card);
          mglows.push(gw);
        }

        // ================= timeline (all motion on tl, fromTo entrances) =================

        // --- BG ambient (elements visible from t=0 via CSS; these are ambient, not entrances) ---
        tl.fromTo(S + ".s05-glow-a",
          { scale: 1, opacity: 1 },
          { scale: 1.12, opacity: 0.8, duration: 2.7, ease: "sine.inOut", yoyo: true, repeat: rep(0.3, 2.7) },
          0.3);
        tl.fromTo(S + ".s05-glow-b",
          { scale: 1.08, opacity: 0.85 },
          { scale: 1, opacity: 1, duration: 3.3, ease: "sine.inOut", yoyo: true, repeat: rep(0.3, 3.3) },
          0.3);
        tl.fromTo(S + ".s05-ruler",
          { x: -16 },
          { x: 16, duration: 5, ease: "sine.inOut", yoyo: true, repeat: rep(0.3, 5) },
          0.3);
        for (let i = 0; i < dots.length; i++) {
          const dx = 26 + rng() * 40;
          const dy = 20 + rng() * 36;
          const dd = 4 + rng() * 3;
          tl.fromTo(dots[i],
            { x: 0, y: 0 },
            { x: dx, y: -dy, duration: dd, ease: "sine.inOut", yoyo: true, repeat: rep(0.4, dd) },
            0.4);
        }

        // --- panel rises (power3.out), then drifts gently ---
        tl.fromTo(S + ".s05-rise",
          { y: 120, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" },
          0.5);
        tl.fromTo(S + ".s05-drift",
          { y: -5 },
          { y: 5, duration: 2.9, ease: "sine.inOut", yoyo: true, repeat: rep(1.5, 2.9) },
          1.5);

        // --- header column slides in (expo.out) ---
        tl.fromTo(S + ".s05-header",
          { x: -46, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.7, ease: "expo.out" },
          0.85);

        // --- ruler strip pops ---
        tl.fromTo(S + ".s05-rulerstrip",
          { opacity: 0, y: -14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" },
          0.95);

        // --- lanes extend (scaleX staggered, expo.out) ---
        for (let i = 0; i < laneEls.length; i++) {
          tl.fromTo(laneEls[i],
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.75, ease: "expo.out" },
            1.0 + i * 0.12);
        }

        // --- audio bars grow in, then shimmer (opacity-only ambient, no 2nd transform) ---
        tl.fromTo(abars,
          { scaleY: 0.12, opacity: 0 },
          { scaleY: 1, opacity: 0.9, duration: 0.45, ease: "power3.out", stagger: 0.008 },
          1.9);
        tl.to(abars,
          { opacity: 0.42, duration: 0.42, ease: "sine.inOut", yoyo: true,
            repeat: rep(6.4, 0.42), stagger: { each: 0.022 } },
          3.7);

        // --- playhead sweeps continuously (linear, finite repeats, lane length 1473px) ---
        tl.fromTo(S + ".s05-playhead",
          { x: 0 },
          { x: 1473, duration: 5.5, ease: "none", repeat: rep(1.5, 5.5) },
          1.5);

        // --- color wheels pop (back.out), discs spin slowly (linear, finite) ---
        const wheels = [".s05-w1", ".s05-w2", ".s05-w3"];
        const spinDur = [9, 12, 7.5];
        for (let i = 0; i < 3; i++) {
          tl.fromTo(S + wheels[i],
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" },
            1.5 + i * 0.18);
          tl.fromTo(S + wheels[i] + " .s05-wheel-disc",
            { rotation: 0 },
            { rotation: 360, duration: spinDur[i], ease: "none", repeat: rep(2.1, spinDur[i]) },
            2.1);
        }

        // --- clips fly in from right and SNAP on the 0.75s beat grid ---
        for (let i = 0; i < clips.length; i++) {
          const c = clips[i];
          // fly + overshoot snap (single transform tween per clip)
          tl.fromTo(c.el,
            { x: 920, opacity: 0, rotation: i % 2 === 0 ? 1.6 : -1.6 },
            { x: 0, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" },
            c.beat - 0.55);
          // landing flash 0.12s (opacity-only on overlay child), then hard-kill
          tl.fromTo(c.flash,
            { opacity: 0 },
            { opacity: 0.9, duration: 0.05, ease: "power1.in" },
            c.beat - 0.05);
          tl.to(c.flash, { opacity: 0, duration: 0.12, ease: "power3.out" }, c.beat);
          tl.set(c.flash, { opacity: 0, visibility: "hidden" }, c.beat + 0.13);
          // beat tick blink (yoyo back to idle state)
          tl.fromTo(c.tick,
            { opacity: 0.18, scaleY: 1 },
            { opacity: 1, scaleY: 1.5, duration: 0.09, ease: "power3.out", yoyo: true, repeat: 1 },
            c.beat - 0.04);
        }

        // --- t=15: panel cluster zooms out to 0.62 and settles bottom-center ---
        tl.fromTo(S + ".s05-zoom",
          { scale: 1, y: 0 },
          { scale: 0.62, y: 295, duration: 2, ease: "power2.inOut" },
          15);

        // --- montage wall fades up behind, staggered, with breathing glows ---
        for (let i = 0; i < mcards.length; i++) {
          tl.fromTo(mcards[i],
            { opacity: 0, y: 30, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power2.out" },
            15.2 + i * 0.11);
          tl.fromTo(mglows[i],
            { opacity: 0 },
            { opacity: 0.55, duration: 0.6, ease: "sine.out" },
            15.5 + i * 0.11);
          tl.to(mglows[i],
            { opacity: 0.25, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: rep(17.6, 1.1) },
            17.6 + i * 0.07);
        }

        window.__timelines["s05"] = tl;
      })();
    </script>
  </div>
</template>
