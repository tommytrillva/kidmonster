    <script src="../vendor/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '#s12 ';
        const DUR = 26;

        // deterministic PRNG (seeded LCG per contract)
        const rng = (seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296))(42);

        // --- build dust field synchronously before any tween references it ---
        const dustHost = document.querySelector(S + ".dust");
        const dustDots = [];
        for (let i = 0; i < 16; i++) {
          const d = document.createElement("div");
          d.className = "dust-dot";
          const sz = 2 + Math.round(rng() * 1.4);
          d.style.width = sz + "px";
          d.style.height = sz + "px";
          d.style.left = Math.round(60 + rng() * 1780) + "px";
          d.style.top = Math.round(120 + rng() * 860) + "px";
          d.style.opacity = (0.12 + rng() * 0.13).toFixed(2);
          d.style.background = i % 3 === 0 ? "rgba(53,208,186,0.9)" : "rgba(143,224,0,0.9)";
          dustHost.appendChild(d);
          dustDots.push(d);
        }

        const finiteRepeat = (start, cycle, end) => Math.max(0, Math.ceil((end - start) / cycle) - 1);

        /* ================= BG ambient (all on tl, all finite) ================= */
        tl.fromTo(S + ".dotgrid",
          { backgroundPosition: "0px 0px" },
          { backgroundPosition: "34px -18px", duration: 24, ease: "sine.inOut" }, 0.3);

        tl.fromTo(S + ".glow-a", { scale: 1 },
          { scale: 1.12, duration: 2.7, ease: "sine.inOut", yoyo: true,
            repeat: finiteRepeat(0.4, 2.7, 23.4) }, 0.4);

        tl.fromTo(S + ".glow-b", { scale: 1 },
          { scale: 1.09, duration: 3.4, ease: "sine.inOut", yoyo: true,
            repeat: finiteRepeat(0.7, 3.4, 23.4) }, 0.7);

        tl.fromTo(S + ".station-glow", { scale: 1 },
          { scale: 1.06, duration: 2.9, ease: "sine.inOut", yoyo: true,
            repeat: finiteRepeat(1.0, 2.9, 22.0) }, 1.0);

        dustDots.forEach((d, i) => {
          tl.fromTo(d, { x: 0, y: 0 },
            { x: 40 + rng() * 90, y: -(50 + rng() * 110), duration: 24.5, ease: "none" }, 0.4);
        });

        // horizon: draws in once, then breathes through the whole scene
        tl.fromTo(S + ".horizon",
          { opacity: 0, scaleX: 0.6 },
          { opacity: 0.55, scaleX: 1, duration: 1.6, ease: "power2.inOut" }, 0.5);
        tl.fromTo(S + ".horizon-glow", { opacity: 0.32 },
          { opacity: 0.55, duration: 2.45, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.2);

        /* ================= camera ================= */
        tl.fromTo(S + ".cam-pan", { x: 36 }, { x: -36, duration: 17, ease: "sine.inOut" }, 0.5);
        tl.fromTo(S + ".row-float", { y: -5 },
          { y: 5, duration: 3.1, ease: "sine.inOut", yoyo: true,
            repeat: finiteRepeat(0.5, 3.1, 25.0) }, 0.5);

        /* ================= station entrances (varied eases) ================= */
        tl.fromTo(S + ".pad-refs", { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);
        tl.fromTo(S + ".dev-slot", { opacity: 0, scale: 0.94 },
          { opacity: 0.7, scale: 1, duration: 0.55, ease: "expo.out" }, 1.0);
        tl.fromTo(S + ".ring-wrap", { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.4);
        tl.fromTo(S + ".enhance-node", { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 1.8);
        tl.fromTo(S + ".mini-tl", { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 2.0);
        tl.fromTo(S + ".prompt-card", { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 2.3);

        // mini-timeline playhead sweep (ambient, finite)
        tl.fromTo(S + ".playhead", { x: 0 },
          { x: 396, duration: 5.0, ease: "none", repeat: finiteRepeat(4.5, 5.0, 23.0) }, 4.5);

        /* ============ phase A: 3 reference thumbs drift in + stack (t0.7-2.6) ============ */
        tl.fromTo(S + ".thumb-in-1",
          { x: -560, y: -160, rotation: -18, opacity: 0 },
          { x: 0, y: 0, rotation: -6, opacity: 1, duration: 0.95, ease: "expo.out" }, 0.7);
        tl.fromTo(S + ".thumb-in-2",
          { x: -620, y: 60, rotation: 10, opacity: 0 },
          { x: 0, y: 0, rotation: 3, opacity: 1, duration: 0.85, ease: "power3.out" }, 1.15);
        tl.fromTo(S + ".thumb-in-3",
          { x: -520, y: 200, rotation: -8, opacity: 0 },
          { x: 0, y: 0, rotation: 8, opacity: 1, duration: 0.8, ease: "back.out(1.4)" }, 1.6);

        /* ============ phase B: thumbs STREAM into prompt card (t3-4.4), bars assemble ============ */
        tl.fromTo(S + ".thumb-in-1 .thumb-fly", { x: 0, y: 0, scale: 1, opacity: 1 },
          { x: 350, y: 8, scale: 0.18, opacity: 0, duration: 0.85, ease: "power2.in" }, 3.0);
        tl.fromTo(S + ".thumb-in-2 .thumb-fly", { x: 0, y: 0, scale: 1, opacity: 1 },
          { x: 340, y: -2, scale: 0.18, opacity: 0, duration: 0.85, ease: "power2.in" }, 3.25);
        tl.fromTo(S + ".thumb-in-3 .thumb-fly", { x: 0, y: 0, scale: 1, opacity: 1 },
          { x: 330, y: -12, scale: 0.18, opacity: 0, duration: 0.85, ease: "power2.in" }, 3.5);
        tl.set(S + ".thumb-in-1", { opacity: 0, visibility: "hidden" }, 4.6);
        tl.set(S + ".thumb-in-2", { opacity: 0, visibility: "hidden" }, 4.6);
        tl.set(S + ".thumb-in-3", { opacity: 0, visibility: "hidden" }, 4.6);

        tl.fromTo(S + ".prompt-icon", { scale: 0, rotation: 45 },
          { scale: 1, rotation: 45, duration: 0.5, ease: "back.out(2)" }, 3.5);
        tl.fromTo(S + ".gbar-1", { scaleX: 0 }, { scaleX: 1, duration: 0.5,  ease: "expo.out" }, 3.7);
        tl.fromTo(S + ".gbar-2", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 3.95);
        tl.fromTo(S + ".gbar-3", { scaleX: 0 }, { scaleX: 1, duration: 0.5,  ease: "expo.out" }, 4.2);
        tl.fromTo(S + ".gbar-4", { scaleX: 0 }, { scaleX: 1, duration: 0.4,  ease: "expo.out" }, 4.45);

        // card flash beat
        tl.fromTo(S + ".prompt-flash", { opacity: 0 },
          { opacity: 0.9, duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 1 }, 6.0);
        tl.set(S + ".prompt-flash", { opacity: 0, visibility: "hidden" }, 6.45);

        /* ============ phase C: still DEVELOPS in the slot (blur 12 -> 0) ============ */
        tl.fromTo(S + ".hero-card",
          { opacity: 0, filter: "blur(12px) brightness(1.9)" },
          { opacity: 1, filter: "blur(0px) brightness(1)", duration: 2.3, ease: "power2.out" }, 6.5);
        tl.fromTo(S + ".hero-scene", { scale: 1 },
          { scale: 1.07, duration: 14, ease: "sine.inOut" }, 7.0);
        tl.fromTo(S + ".dev-slot",
          { boxShadow: "0 0 18px rgba(143,224,0,0.08)" },
          { boxShadow: "0 0 34px rgba(143,224,0,0.30)", duration: 0.8, ease: "power2.out",
            immediateRender: false }, 6.6);

        /* ============ phase D: glide into the animation node ring ============ */
        tl.fromTo(S + ".hero-a", { x: 0 },
          { x: 330, duration: 1.9, ease: "power2.inOut" }, 10.0);
        tl.fromTo(S + ".ring-spin", { rotation: 0 },
          { rotation: 640, duration: 10.4, ease: "power1.inOut" }, 11.4);
        tl.fromTo(S + ".ring-glow", { opacity: 0.12 },
          { opacity: 0.55, duration: 0.8, ease: "power2.out", immediateRender: false }, 11.6);

        // motion streak lines sweep the still
        tl.fromTo(S + ".streak-1", { x: -340 },
          { x: 360, duration: 1.05, ease: "power2.inOut", repeat: 1 }, 12.1);
        tl.fromTo(S + ".streak-2", { x: -360 },
          { x: 360, duration: 1.05, ease: "power2.inOut", repeat: 1 }, 12.65);
        tl.fromTo(S + ".streak-3", { x: -320 },
          { x: 360, duration: 1.05, ease: "power2.inOut", repeat: 1 }, 13.2);
        tl.set(S + ".streak-1", { opacity: 0, visibility: "hidden" }, 15.5);
        tl.set(S + ".streak-2", { opacity: 0, visibility: "hidden" }, 15.5);
        tl.set(S + ".streak-3", { opacity: 0, visibility: "hidden" }, 15.5);

        /* ============ phase E: enhance — move on, +12% scale, crisp flare ============ */
        tl.fromTo(S + ".hero-b", { x: 0, scale: 1 },
          { x: 275, scale: 1.12, duration: 1.4, ease: "power3.out" }, 15.2);
        tl.fromTo(S + ".enhance-node",
          { boxShadow: "0 0 26px rgba(143,224,0,0.12), inset 0 1px 0 rgba(234,245,226,0.12)" },
          { boxShadow: "0 0 44px rgba(198,255,77,0.35), inset 0 1px 0 rgba(234,245,226,0.12)",
            duration: 0.7, ease: "power2.out", immediateRender: false }, 15.8);
        // crisp flare: one transform tween + one opacity ping (no transform stacking)
        tl.fromTo(S + ".flare-5", { scale: 0.4 },
          { scale: 1.7, duration: 0.6, ease: "power2.out" }, 16.2);
        tl.fromTo(S + ".flare-5", { opacity: 0 },
          { opacity: 0.9, duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 1 }, 16.2);
        tl.fromTo(S + ".hero-flare", { opacity: 0 },
          { opacity: 0.85, duration: 0.18, ease: "power1.inOut", yoyo: true, repeat: 1 }, 16.3);
        tl.set(S + ".hero-flare", { opacity: 0, visibility: "hidden" }, 16.8);
        tl.set(S + ".flare-5", { opacity: 0 }, 17.0);

        /* ============ phase F: drop onto the mini timeline, snap flash ============ */
        tl.fromTo(S + ".hero-c", { x: 0, y: 0, scale: 1 },
          { x: 80, y: 229, scale: 0.4, duration: 0.5, ease: "power2.in" }, 17.2);
        tl.fromTo(S + ".snap-flash", { opacity: 0 },
          { opacity: 0.9, duration: 0.15, ease: "power1.inOut", yoyo: true, repeat: 1 }, 17.65);
        tl.set(S + ".snap-flash", { opacity: 0, visibility: "hidden" }, 18.0);
        tl.fromTo(S + ".mini-tl",
          { boxShadow: "0 0 30px rgba(143,224,0,0.12), inset 0 1px 0 rgba(234,245,226,0.12)" },
          { boxShadow: "0 0 46px rgba(143,224,0,0.30), inset 0 1px 0 rgba(234,245,226,0.12)",
            duration: 0.6, ease: "power2.out", immediateRender: false }, 17.7);

        /* ============ phase G: ZOOM OUT, cables draw, grand pulse, station flares ============ */
        tl.fromTo(S + ".cam-zoom", { scale: 1 },
          { scale: 0.8, duration: 2.5, ease: "power2.inOut" }, 18.0);

        tl.fromTo(S + ".cable-base",
          { attr: { "stroke-dashoffset": 2300 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 1.9, ease: "power2.inOut" }, 18.3);

        // grand pulse travels the whole pipeline (dash sits off-path before/after)
        tl.fromTo(S + ".cable-pulse",

        const flareTimes = [20.35, 20.7, 21.05, 21.4, 21.75, 22.1];
        flareTimes.forEach((t, i) => {
          const f = S + ".flare-" + (i + 1);
          if (i === 4) {
            // flare-5 already used its transform tween at the enhance beat; opacity ping only
            tl.fromTo(f, { opacity: 0 },
              { opacity: 0.9, duration: 0.22, ease: "power1.inOut", yoyo: true, repeat: 1,

          }
          tl.set(f, { opacity: 0, visibility: "hidden" }, t + 0.75);
        });

        /* ============ phase H: FINAL RESOLVE — soften, heartbeat, gentle fade ============ */
        tl.fromTo(S + ".station-glow", { opacity: 0.2 },
          { opacity: 0.08, duration: 1.6, ease: "power1.inOut", immediateRender: false }, 22.0);

        // one last shoreline heartbeat
        tl.fromTo(S + ".horizon-glow", { opacity: 0.4 },
          { opacity: 0.95, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1,
            immediateRender: false }, 22.3);

        // the ONLY allowed scene exit: everything fades to the dark bg, horizon remains faint
        tl.fromTo(S + ".fade-all", { opacity: 1 },
          { opacity: 0, duration: 2.1, ease: "power1.inOut" }, 23.4);
        tl.set(S + ".fade-all", { opacity: 0, visibility: "hidden" }, 25.6);
        tl.fromTo(S + ".horizon",
          { opacity: 0.55 },
          { opacity: 0.3, duration: 2.3, ease: "power1.inOut", immediateRender: false }, 23.5);
        tl.fromTo(S + ".horizon-glow", { opacity: 0.4 },
          { opacity: 0.2, duration: 2.3, ease: "power1.inOut", immediateRender: false }, 23.5);

        window.__timelines["s12"] = tl;
      })();
