    <script src="../vendor/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '#s01 ';
        const root = document.querySelector('#s01');

        const DUR = 16; // local scene duration in seconds
        // finite-repeat helper per contract: repeat = ceil(remaining / cycle) - 1
        const rep = (cycle, at) => Math.max(0, Math.ceil((DUR - at) / cycle) - 1);

        // deterministic PRNG (mulberry32, seed 42)
        const mulberry32 = (seed) => () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const rng = mulberry32(42);

        /* ---- build waveform bars synchronously (before any tween) ---- */
        const wave = root.querySelector(".waveform");
        const N = 88;
        const amps = [];
        for (let i = 0; i < N; i++) {
          const env = Math.sin((Math.PI * i) / (N - 1)); // taller mid-window
          const h = Math.round(46 + env * 230 + rng() * 160); // some > 330 => overshoot
          const r = rng();
          const color = r < 0.14 ? "#c6ff4d" : r < 0.24 ? "#35d0ba" : "#8fe000";
          amps.push(rng());
          const bar = document.createElement("div");
          bar.className = "wbar";
          bar.style.height = h + "px";
          const pulse = document.createElement("div");
          pulse.className = "wbar-pulse";
          const core = document.createElement("div");
          core.className = "wbar-core";
          core.style.background = color;
          pulse.appendChild(core);
          bar.appendChild(pulse);
          wave.appendChild(bar);
        }

        /* ---- build sea-spray dots synchronously ---- */
        const spray = root.querySelector(".spray");
        const dots = [];
        for (let i = 0; i < 12; i++) {
          const d = document.createElement("div");
          d.className = "spray-dot";
          const size = rng() < 0.5 ? 2 : 3;
          d.style.width = size + "px";
          d.style.height = size + "px";
          d.style.left = Math.round(140 + rng() * 1640) + "px";
          d.style.top = Math.round(120 + rng() * 840) + "px";
          d.style.background = rng() < 0.4 ? "#35d0ba" : "#8fe000";
          spray.appendChild(d);
          dots.push(d);
        }

        /* ================= timeline (local 0 -> 16) ================= */

        // camera: slow 3% push-in on the scene wrapper (its only transform tween)
        tl.fromTo(
          S + ".cam",
          { scale: 1 },
          { scale: 1.03, duration: 15.7, ease: "power2.inOut" },
          0.3
        );

        // BG grid drifts the whole scene
        tl.fromTo(
          S + ".bg-grid",
          { x: 0, y: 0 },
          { x: -44, y: -26, duration: 15.65, ease: "sine.inOut" },
          0.35
        );

        // glows breathe (finite repeats, different cycles)
        tl.fromTo(
          S + ".glow-a",
          { scale: 0.95 },
          {
            scale: 1.08,
            duration: 3.8,
            ease: "sine.inOut",
            yoyo: true,
            repeat: rep(3.8, 0.35),
          },
          0.35
        );
        tl.fromTo(
          S + ".glow-b",
          { scale: 1.05 },
          {
            scale: 0.94,
            duration: 5.4,
            ease: "sine.inOut",
            yoyo: true,
            repeat: rep(5.4, 0.35),
          },
          0.35
        );
        // warm bleed rises as doubt turns to curiosity (opacity only)
        tl.fromTo(
          S + ".glow-b",
          { opacity: 0.55 },
          { opacity: 0.95, duration: 2.6, ease: "sine.inOut" },
          12.0
        );

        // spray dots: slow up-right drift + soft fade-in (one transform tween each)
        dots.forEach((d, i) => {
          const t0 = 0.35 + (i % 4) * 0.05;
          tl.fromTo(
            d,
            { x: 0, y: 0 },
            {
              x: 24 + rng() * 70,
              y: -(34 + rng() * 96),
              duration: DUR - t0,
              ease: "none",
            },
            t0
          );
          tl.fromTo(
            d,
            { opacity: 0 },
            { opacity: 0.14 + rng() * 0.1, duration: 1.6, ease: "sine.out" },
            t0
          );
        });

        // window glides up into place (entrance on wrapper)
        tl.fromTo(
          S + ".win-wrap",
          { y: 90, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.9, ease: "expo.out" },
          0.5
        );
        // gentle ambient float on the window itself (separate element)
        tl.fromTo(
          S + ".window",
          { y: 0 },
          {
            y: -7,
            duration: 2.4,
            ease: "sine.inOut",
            yoyo: true,
            repeat: rep(2.4, 1.5),
          },
          1.5
        );
        // window glow intensifies as the waveform overwhelms (box-shadow only)
        tl.fromTo(
          S + ".window",
          { boxShadow: "0 0 40px rgba(143,224,0,0.18)" },
          {
            boxShadow: "0 0 86px rgba(143,224,0,0.34)",
            duration: 1.6,
            ease: "sine.inOut",
          },
          5.0
        );

        // file chip pops
        tl.fromTo(
          S + ".chip",
          { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" },
          1.6
        );

        // baseline draws under the waveform
        tl.fromTo(
          S + ".baseline",
          { scaleX: 0 },
          { scaleX: 1, duration: 1.0, ease: "power2.inOut" },
          2.0
        );

        // waveform bars grow staggered from the baseline (entrance on .wbar)
        tl.fromTo(
          S + ".wbar",
          { scaleY: 0 },
          {
            scaleY: 1,
            duration: 0.7,
            ease: "power3.out",
            stagger: { each: 0.02, from: "start" },
          },
          2.2
        );
        // overwhelming ambient pulse (on .wbar-pulse — separate layer).
        // yoyo repeat 7 = 8 passes -> ends back at scaleY 1 around t=12.
        tl.fromTo(
          S + ".wbar-pulse",
          { scaleY: 1 },
          {
            scaleY: (i) => 0.72 + amps[i] * 0.62,
            duration: 1.05,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 7,
            stagger: { each: 0.008, from: "center" },
          },
          3.6
        );

        // cursor fades in (opacity on wrapper only)
        tl.fromTo(
          S + ".cursor-wrap",
          { opacity: 0 },
          { opacity: 1, duration: 0.45, ease: "power1.out" },
          6.6
        );
        // cursor path: ONE keyframes tween on the child (single transform tween).
        // approach -> creep onto the close ring -> flinch -> hesitate -> pull back -> idle
        tl.to(
          S + ".cursor",
          {
            keyframes: [
              { x: 352, y: -522, duration: 2.0, ease: "power2.inOut" },
              { x: 352, y: -522, duration: 0.15, ease: "none" },
              { x: 369, y: -541, duration: 0.35, ease: "sine.inOut" },
              { x: 341, y: -516, duration: 0.28, ease: "power1.out" },
              { x: 341, y: -516, duration: 0.17, ease: "none" },
              { x: 357, y: -529, duration: 0.3, ease: "sine.inOut" },
              { x: 357, y: -529, duration: 0.3, ease: "none" },
              { x: 150, y: -150, duration: 1.7, ease: "power2.inOut" },
              { x: 150, y: -150, duration: 0.35, ease: "none" },
              { x: 158, y: -142, duration: 3.2, ease: "sine.inOut" },
            ],
          },
          7.0
        );

        // close control glows warning-warm while the cursor hovers (no transforms)
        tl.fromTo(
          S + ".close-ring",
          {
            borderColor: "rgba(234,245,226,0.40)",
            backgroundColor: "rgba(234,245,226,0.06)",
            boxShadow: "0 0 10px rgba(143,224,0,0.10)",
          },
          {
            borderColor: "rgba(255,100,115,0.95)",
            backgroundColor: "rgba(255,100,115,0.16)",
            boxShadow: "0 0 26px rgba(255,100,115,0.55)",
            duration: 0.42,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 6,
          },
          7.6
        );
        tl.to(
          S + ".close-ring",
          {
            borderColor: "rgba(234,245,226,0.40)",
            backgroundColor: "rgba(234,245,226,0.06)",
            boxShadow: "0 0 10px rgba(143,224,0,0.10)",
            duration: 0.8,
            ease: "power1.inOut",
          },
          10.6
        );

        /* ---- the morph: chaos exhales into a calm AI video timeline ---- */

        // bars settle + re-tint toward accent-deep (on .wbar-core — its only transform)
        tl.to(
          S + ".wbar-core",
          {
            scaleY: 0.42,
            backgroundColor: "#3e8e0e",
            opacity: 0.6,
            boxShadow: "0 0 6px rgba(62,142,14,0.25)",
            duration: 1.3,
            ease: "power2.inOut",
            stagger: { each: 0.006, from: "edges" },
          },
          12.0
        );
        // baseline brightens into the shoreline motif (box-shadow only)
        tl.to(
          S + ".baseline",
          {
            boxShadow: "0 0 26px rgba(198,255,77,0.55)",
            backgroundColor: "rgba(198,255,77,0.75)",
            duration: 0.9,
            ease: "sine.inOut",
          },
          12.0
        );

        // track structure fades up over the waveform (opacity on wrapper)
        tl.fromTo(
          S + ".tracks",
          { opacity: 0 },
          { opacity: 1, duration: 0.8, ease: "sine.out" },
          12.3
        );
        // lanes extend (their only transform tween)
        tl.fromTo(
          S + ".lane",
          { scaleX: 0 },
          {
            scaleX: 1,
            duration: 0.7,
            ease: "expo.out",
            stagger: { each: 0.15, from: "start" },
          },
          12.45
        );
        // clip blocks lock in
        tl.fromTo(
          S + ".tclip",
          { scale: 0.55, opacity: 0 },
          {
            scale: 1,
            opacity: 1,
            duration: 0.32,
            ease: "back.out(1.6)",
            stagger: { each: 0.12, from: "start" },
          },
          12.9
        );
        // calm breathe on the timeline underglow through the final frame
        tl.fromTo(
          S + ".underglow",
          { opacity: 0.4 },
          {
            opacity: 0.7,
            duration: 0.75,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 1,
          },
          14.5
        );

        window.__timelines["s01"] = tl;
      })();
    </script>
  </div>
</template>
