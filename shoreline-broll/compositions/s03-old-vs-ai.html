          rgba(255, 100, 115, 0.35) 0%,
          rgba(255, 100, 115, 0.08) 50%,
          rgba(255, 100, 115, 0) 74%
        );
      }
      #s03 .card-flash {
        position: absolute;
        inset: 0;
        border-radius: 10px;
        opacity: 0;
        background: radial-gradient(
          circle,
          rgba(198, 255, 77, 0.5) 0%,
          rgba(198, 255, 77, 0.12) 55%,
          rgba(198, 255, 77, 0) 80%
        );
      }

      /* ---------- particles ---------- */
      #s03 .fx-particles {
        position: absolute;
        inset: 0;
      }
      #s03 .pw {
        position: absolute;
        width: 0px;
        height: 0px;
      }
      #s03 .pd {
        position: absolute;
        left: -4px;
        top: -4px;
        border-radius: 50%;
        opacity: 0;
      }
    </style>
    <script src="../vendor/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '#s03 ';
        const root = document.querySelector('#s03');
        const DUR = 25;

        // deterministic PRNG (mulberry32, seed 42)
        const mulberry32 = (seed) => () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const rng = mulberry32(42);

        // finite-repeat helper: cycles that roughly fill remaining scene time
        const reps = (start, cycle) =>
          Math.max(1, Math.round((DUR - start) / cycle) - 1);

        // ---------- scene data ----------
        const nodes = [
          { sel: ".n-hub", cx: 650, cy: 600 },
          { sel: ".n-a", cx: 480, cy: 455 },
          { sel: ".n-b", cx: 845, cy: 470 },
          { sel: ".n-c", cx: 450, cy: 730 },
          { sel: ".n-d", cx: 835, cy: 745 },
          { sel: ".n-e", cx: 1010, cy: 600 },
        ];
        // plate -> target node index, shatter beat every ~1.6s from t=5
        const plates = [
          { sel: ".p-camera", cx: 294, cy: 320, node: 0, shatter: 5.0 },
          { sel: ".p-drone", cx: 629, cy: 210, node: 1, shatter: 6.6 },
          { sel: ".p-clapper", cx: 1004, cy: 180, node: 2, shatter: 8.2 },
          { sel: ".p-pin", cx: 1374, cy: 245, node: 5, shatter: 9.8 },
          { sel: ".p-permit", cx: 1629, cy: 430, node: 4, shatter: 11.4 },
          { sel: ".p-chair", cx: 264, cy: 630, node: 3, shatter: 13.0 },
        ];

        // ---------- build particle DOM synchronously (before tweens) ----------
        const layer = root.querySelector(".fx-particles");
        const pdata = [];
        plates.forEach((pl) => {
          const target = nodes[pl.node];
          const count = 8 + Math.floor(rng() * 5); // 8-12 dots
          for (let k = 0; k < count; k++) {
            const w = document.createElement("div");
            w.className = "pw";
            w.style.left = pl.cx + "px";
            w.style.top = pl.cy + "px";
            const d = document.createElement("div");
            d.className = "pd";
            const sz = 5 + Math.floor(rng() * 4);
            d.style.width = sz + "px";
            d.style.height = sz + "px";
            const c = rng();
            if (c < 0.45) {
              d.style.background = "#8fe000";
              d.style.boxShadow = "0 0 10px rgba(143,224,0,0.8)";
            } else if (c < 0.8) {
              d.style.background = "#c6ff4d";
              d.style.boxShadow = "0 0 10px rgba(198,255,77,0.8)";
            } else {
              d.style.background = "#35d0ba";
              d.style.boxShadow = "0 0 10px rgba(53,208,186,0.8)";
            }
            w.appendChild(d);
            layer.appendChild(w);
            const ang = rng() * Math.PI * 2;
            const rad = 30 + rng() * 55;
            const bx = Math.cos(ang) * rad;
            const by = Math.sin(ang) * rad;
            pdata.push({
              w,
              d,
              bx,
              by,
              dx: target.cx - pl.cx - bx + (rng() - 0.5) * 36,
              dy: target.cy - pl.cy - by + (rng() - 0.5) * 36,
              t: pl.shatter + rng() * 0.12,
            });
          }
        });

        // ================= BG ambient (all on tl, finite) =================
        tl.fromTo(
          S + ".bg-grid",
          { x: 0, y: 0 },
          { x: -64, y: -32, duration: DUR - 0.3, ease: "none" },
          0.3
        );
        tl.fromTo(
          S + ".glow-a",
          { scale: 1, opacity: 0.16 },
          {
            scale: 1.12,
            opacity: 0.24,
            duration: 3.2,
            ease: "sine.inOut",
            yoyo: true,
            repeat: reps(0.3, 3.2),
          },
          0.3
        );
        tl.fromTo(
          S + ".glow-b",
          { scale: 1, opacity: 0.13 },
          {
            scale: 1.15,
            opacity: 0.2,
            duration: 4.1,
            ease: "sine.inOut",
            yoyo: true,
            repeat: reps(0.5, 4.1),
          },
          0.5
        );
        // warm bleed rises when the memory cards start arriving
        tl.fromTo(
          S + ".glow-warm",
          { opacity: 0 },
          { opacity: 0.2, duration: 2.5, ease: "sine.out" },
          16.5
        );
        tl.fromTo(
          S + ".glow-warm",
          { scale: 1 },
          {
            scale: 1.1,
            duration: 3.0,
            ease: "sine.inOut",
            yoyo: true,
            repeat: reps(19, 3.0),
          },
          19
        );

        // corner registration ticks: fade in, then slow breathe
        tl.fromTo(
          S + ".tick",
          { opacity: 0 },
          { opacity: 0.3, duration: 0.6, ease: "power1.out", stagger: 0.08 },
          0.35
        );
        tl.to(
          S + ".tick",
          {
            opacity: 0.14,
            duration: 2.6,
            ease: "sine.inOut",
            yoyo: true,
            repeat: reps(1.4, 2.6),
          },
          1.4
        );

        // ================= ACT 1: ghost plates materialize =================
        plates.forEach((pl, i) => {
          const tIn = 0.8 + i * 0.5;
          // entrance on outer wrapper (only transform tween on .plate-w)
          tl.fromTo(
            S + pl.sel,
            { opacity: 0, y: 26, filter: "blur(14px)" },
            {
              opacity: 1,
              y: 0,
              filter: "blur(0px)",
              duration: 0.65,
              ease: i % 2 === 0 ? "power2.out" : "sine.out",
            },
            tIn
          );
          // hover ambient on middle wrapper (only transform tween on .plate-h)
          const hStart = tIn + 0.7;
          const cyc = 1.2 + i * 0.07;
          tl.fromTo(
            S + pl.sel + " .plate-h",
            { y: -4, rotation: i % 2 === 0 ? -1.2 : 1.2 },
            {
              y: 4,
              rotation: i % 2 === 0 ? 1.2 : -1.2,
              duration: cyc,
              ease: "sine.inOut",
              yoyo: true,
              repeat: Math.max(1, Math.ceil((pl.shatter - hStart) / cyc) - 1),
            },
            hStart
          );
        });

        // ================= ACT 2: plates burst into particles =================
        plates.forEach((pl) => {
          const tB = pl.shatter;
          // shatter on inner plate (only transform tween on .plate)
          tl.fromTo(
            S + pl.sel + " .plate",
            { scale: 1, opacity: 1 },
            { scale: 1.18, opacity: 0, duration: 0.32, ease: "power2.in" },
            tB
          );
          // burst flash: fromTo from hidden (seek-safe), then opacity-only decay
          tl.fromTo(
            S + pl.sel + " .plate-burst",
            { opacity: 0, scale: 0.5 },
            { opacity: 0.85, scale: 1.6, duration: 0.14, ease: "power3.out" },
            tB
          );
          tl.to(
            S + pl.sel + " .plate-burst",
            { opacity: 0, duration: 0.3, ease: "power1.in" },
            tB + 0.14
          );
          // hard-kill the whole plate after its mid-scene dissolve
          tl.set(
            S + pl.sel,
            { opacity: 0, visibility: "hidden" },
            tB + 0.5
          );
        });

        // particles: burst out (dot child) + stream to node (wrapper)
        pdata.forEach((p) => {
          tl.fromTo(
            p.w,
            { x: 0, y: 0 },
            { x: p.dx, y: p.dy, duration: 1.1, ease: "power2.in" },
            p.t
          );
          tl.fromTo(
            p.d,
            { x: 0, y: 0, opacity: 0, scale: 0.4 },
            {
              x: p.bx,
              y: p.by,
              opacity: 1,
              scale: 1,
              duration: 0.28,
              ease: "power3.out",
            },
            p.t
          );
          tl.to(p.d, { opacity: 0, duration: 0.3, ease: "power1.in" }, p.t + 0.85);
          tl.set(p.w, { opacity: 0, visibility: "hidden" }, p.t + 1.25);
        });

        // ================= ACT 3: nodes ignite as particles arrive =================
        // node order follows plate dissolve order: hub, a, b, e, d, c
        const ignite = [
          { sel: ".n-hub", t: 6.1 },
          { sel: ".n-a", t: 7.7 },
          { sel: ".n-b", t: 9.3 },
          { sel: ".n-e", t: 10.9 },
          { sel: ".n-d", t: 12.5 },
          { sel: ".n-c", t: 14.1 },
        ];
        ignite.forEach((n, i) => {
          tl.fromTo(
            S + n.sel,
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.8)" },
            n.t
          );
          // breathing glow on child until scene end (finite)
          const gCyc = 1.1 + i * 0.08;
          tl.fromTo(
            S + n.sel + " .node-glow",
            { opacity: 0.25 },
            {
              opacity: 0.8,
              duration: gCyc,
              ease: "sine.inOut",
              yoyo: true,
              repeat: reps(n.t + 0.5, gCyc),
            },
            n.t + 0.5
          );
        });
        // hub orbit ring, slow finite rotation till end (only transform on ring)
        tl.fromTo(
          S + ".hub-ring",
          { rotation: 0 },
          { rotation: 130, duration: DUR - 6.7, ease: "none" },
          6.7
        );

        // ================= ACT 4: cables draw =================
        const cableDraws = [
          { sel: ".c1", t: 13.0 },
          { sel: ".c2", t: 13.45 },
          { sel: ".c3", t: 13.9 },
          { sel: ".c4", t: 14.35 },
          { sel: ".c5", t: 14.8 },
          { sel: ".c6", t: 15.2 },
          { sel: ".c7", t: 15.6 },
        ];
        cableDraws.forEach((c) => {
          tl.fromTo(
            S + c.sel,
            { attr: { "stroke-dashoffset": 100 } },
            {
              attr: { "stroke-dashoffset": 0 },
              duration: 0.9,
              ease: "power2.inOut",
            },
            c.t
          );
        });

        // ================= ACT 5: pulses race the cables =================
        // network pulses: staggered, finite repeats sized to remaining time
        [".u1", ".u2", ".u3", ".u4", ".u5", ".u6"].forEach((sel, i) => {
          const t0 = 17.0 + i * 0.22;
          tl.fromTo(
            S + sel,
            { attr: { "stroke-dashoffset": 12 } },
            {
              attr: { "stroke-dashoffset": -100 },
              duration: 1.0,
              ease: "power1.inOut",
              repeat: Math.max(1, Math.floor((DUR - t0 - 1.0) / 1.5)),
              repeatDelay: 0.5,
            },
            t0
          );
        });
        // output cable: 4 discrete pulses, one per frame card
        tl.fromTo(
          S + ".u7",
          { attr: { "stroke-dashoffset": 12 } },
          {
            attr: { "stroke-dashoffset": -100 },
            duration: 0.8,
            ease: "power1.inOut",
            repeat: 3,
            repeatDelay: 0.7,
          },
          17.0
        );

        // ================= ACT 6: frame cards deal out =================
        // deal moments = output pulse arrivals (17.0/18.5/20.0/21.5 + 0.8 travel)
        const cards = [
          { sel: ".card-1", t: 17.8, ry: -8, kx: 14 },
          { sel: ".card-2", t: 19.3, ry: -6, kx: -14 },
          { sel: ".card-3", t: 20.8, ry: -8, kx: 12 },
          { sel: ".card-4", t: 22.3, ry: -5, kx: -12 },
        ];
        cards.forEach((cd) => {
          // deal entrance on wrapper (single combined transform tween)
          tl.fromTo(
            S + cd.sel,
            {
              x: 240,
              opacity: 0,
              rotationY: -34,
              scale: 0.92,
              transformPerspective: 1100,
            },
            {
              x: 0,
              opacity: 1,
              rotationY: cd.ry,
              scale: 1,
              duration: 0.75,
              ease: "expo.out",
            },
            cd.t
          );
          // landing flash: appear via fromTo from hidden, decay opacity-only
          tl.fromTo(
            S + cd.sel + " .card-flash",
            { opacity: 0 },
            { opacity: 0.6, duration: 0.12, ease: "power3.out" },
            cd.t + 0.4
          );
          tl.to(
            S + cd.sel + " .card-flash",
            { opacity: 0, duration: 0.4, ease: "power1.in" },
            cd.t + 0.52
          );
          // Ken Burns on child layer, runs to scene end (single transform tween)
          tl.fromTo(
            S + cd.sel + " .kb",
            { scale: 1.04, x: 0 },
            { scale: 1.13, x: cd.kx, duration: DUR - (cd.t + 0.2), ease: "none" },
            cd.t + 0.2
          );
        });

        window.__timelines["s03"] = tl;
      })();
    </script>
  </div>
</template>
