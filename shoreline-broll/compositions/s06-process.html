    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '[data-composition-id="s06"] ';
        const DUR = 36;

        // deterministic PRNG (LCG per contract)
        const rng = (seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296))(42);

        /* ============ generate fog pills (synchronously, before tweens) ============ */
        const fogLayer = document.querySelector(S + ".fog-layer");
        const pills = [];
        for (let i = 0; i < 10; i++) {
          const w = 180 + rng() * 240;
          const h = 70 + rng() * 80;
          const x = 60 + rng() * (1700 - w);
          const y = 70 + rng() * (920 - h);
          const wrap = document.createElement("div");
          wrap.className = "fogw";
          wrap.style.left = x + "px";
          wrap.style.top = y + "px";
          const p = document.createElement("div");
          p.className = "fog";
          const r1 = (40 + rng() * 22) | 0, r2 = (40 + rng() * 22) | 0;
          const r3 = (40 + rng() * 22) | 0, r4 = (40 + rng() * 22) | 0;
          p.style.width = w + "px";
          p.style.height = h + "px";
          p.style.borderRadius = r1 + "% " + (100 - r1) + "% " + r2 + "% " + (100 - r2) + "% / " +
                                 r3 + "% " + (100 - r3) + "% " + r4 + "% " + (100 - r4) + "%";
          p.style.filter = "blur(" + (8 + rng() * 6).toFixed(1) + "px)";
          const a = (0.12 + rng() * 0.08).toFixed(3);
          p.style.background = (i % 3 === 0)
            ? "rgba(150, 230, 120, " + a + ")"
            : "rgba(234, 245, 226, " + a + ")";
          wrap.appendChild(p);
          fogLayer.appendChild(wrap);
          pills.push({ wrap: wrap, pill: p, cx: x + w / 2 });
        }

        /* ============ generate sea-spray dots ============ */
        const sprayLayer = document.querySelector(S + ".spray-layer");
        const dots = [];
        for (let i = 0; i < 12; i++) {
          const d = document.createElement("div");
          d.className = "spray";
          const sz = 2 + ((rng() * 2) | 0);
          d.style.width = sz + "px";
          d.style.height = sz + "px";
          d.style.left = (rng() * 1880) + "px";
          d.style.top = (140 + rng() * 880) + "px";
          d.style.opacity = (0.14 + rng() * 0.1).toFixed(2);
          d.style.background = (i % 3 === 0) ? "#35d0ba" : "#8fe000";
          sprayLayer.appendChild(d);
          dots.push(d);
        }

        /* ============ BG ambient (finite repeats, all on tl) ============ */
        // glows breathe: 12 cycles x 3s = 36s
        tl.fromTo(S + ".glow-a", { scale: 0.95, opacity: 0.7 },
          { scale: 1.1, opacity: 1, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 11 }, 0);
        tl.fromTo(S + ".glow-b", { scale: 1.08, opacity: 1 },
          { scale: 0.94, opacity: 0.65, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 11 }, 0);

        // blurry grid: drifts during fog phase, fades out as the wipe lands, then hard-kill
        tl.fromTo(S + ".grid-blur", { x: -16 },
          { x: 16, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo(S + ".grid-blur", { opacity: 0.14 },
          { opacity: 0, duration: 5, ease: "power2.inOut", immediateRender: false }, 8);
        tl.set(S + ".grid-blur", { opacity: 0, visibility: "hidden" }, 13.05);

        // crisp grid takes over (blurry-to-crisp via cross-dissolve, no filter tween)
        tl.fromTo(S + ".grid-crisp", { opacity: 0 },
          { opacity: 0.12, duration: 5, ease: "power2.inOut" }, 8);
        tl.fromTo(S + ".grid-crisp", { x: -14 },
          { x: 14, duration: 4.5, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 8);

        // sea spray drifts up-right, finite yoyo cycles within 36s
        dots.forEach((d) => {
          const dx = 40 + rng() * 60;
          const dy = 30 + rng() * 50;
          const dur = 4 + rng() * 2;
          const rep = Math.max(1, Math.floor((DUR - 0.3) / dur) - 1);
          tl.fromTo(d, { x: 0, y: 0 },
            { x: dx, y: -dy, duration: dur, ease: "sine.inOut", yoyo: true, repeat: rep }, 0.3);
        });

        // slow camera push on the stage wrapper (only transform tween on .stage)
        tl.fromTo(S + ".stage", { scale: 1 },
          { scale: 1.03, duration: 35.7, ease: "power2.inOut" }, 0.3);

        /* ============ phase 1 (0-8s): fog pills wander ============ */
        pills.forEach((o, i) => {
          // fade in (opacity only — inner element)
          tl.fromTo(o.pill, { opacity: 0 },
            { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.3 + i * 0.06);
          // aimless drift (only transform tween on the wrapper)
          const dx = -70 + rng() * 140;
          const dy = -50 + rng() * 100;
          const dur = 3.5 + rng() * 2;
          const rep = Math.ceil(10 / dur) - 1;
          tl.fromTo(o.wrap, { x: 0, y: 0 },
            { x: dx, y: dy, duration: dur, ease: "sine.inOut", yoyo: true, repeat: rep }, 0.3);
        });

        /* ============ phase 2 (8-9.6s): squeegee sweep ============ */
        const sweepStart = 8, sweepDur = 1.6, sweepDist = 2080;
        const easeFn = gsap.parseEase("power3.inOut");
        // time at which the eased bar core crosses screen-x px
        const barTimeAt = (px) => {
          const target = Math.min(1, Math.max(0, (px + 80) / sweepDist));
          let lo = 0, hi = 1;
          for (let k = 0; k < 24; k++) {
            const mid = (lo + hi) / 2;
            if (easeFn(mid) < target) lo = mid; else hi = mid;
          }
          return sweepStart + sweepDur * ((lo + hi) / 2);
        };

        // bar appears (opacity on inner), sweeps (x on wrapper), fades, hard-killed
        tl.fromTo(S + ".bar-inner", { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: "power2.out" }, 7.6);
        tl.fromTo(S + ".bar-wrap", { x: 0 },
          { x: sweepDist, duration: sweepDur, ease: "power3.inOut" }, sweepStart);
        tl.fromTo(S + ".bar-inner", { opacity: 1 },
          { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 9.65);
        tl.set(S + ".bar-wrap", { opacity: 0, visibility: "hidden" }, 10.1);

        // each pill is wiped exactly as the bar passes it, then hard-killed
        pills.forEach((o) => {
          const tW = barTimeAt(o.cx);
          tl.fromTo(o.pill, { x: 0, opacity: 1 },
            { x: 140, opacity: 0, duration: 0.32, ease: "power2.out", immediateRender: false }, tW);
          tl.set(o.pill, { opacity: 0, visibility: "hidden" }, tW + 0.34);
          tl.set(o.wrap, { visibility: "hidden" }, tW + 0.36);
        });

        /* ============ phase 3: columns rise behind the bar ============ */
        const colCenters = [250, 605, 960, 1315, 1670];
        const colSel = [S + ".col-1", S + ".col-2", S + ".col-3", S + ".col-4", S + ".col-5"];
        colSel.forEach((sel, i) => {
          const tCol = barTimeAt(colCenters[i]) + 0.08;
          tl.fromTo(sel, { y: 140, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, tCol);
          tl.fromTo(sel + " .h-line", { scaleX: 0 },
            { scaleX: 1, duration: 0.6, ease: "power2.out" }, tCol + 0.5);
        });

        /* ============ phase 4 (12-25s): columns populate, each in its own rhythm ============ */
        // col 1 — moodboard cards FLIP in
        gsap.utils.toArray(document.querySelectorAll(S + ".mood-card")).forEach((el, i) => {
          tl.fromTo(el, { rotationY: -95, opacity: 0 },
            { rotationY: 0, opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, 12 + i * 0.28);
        });

        // col 2 — shot cards DEAL in from the left
        gsap.utils.toArray(document.querySelectorAll(S + ".shot-card")).forEach((el, i) => {
          tl.fromTo(el, { x: -180, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 14.2 + i * 0.2);
        });

        // col 3 — node chips CLICK in, cable stubs draw between them
        gsap.utils.toArray(document.querySelectorAll(S + ".node-chip")).forEach((el, i) => {
          tl.fromTo(el, { scale: 0.4, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }, 16.6 + i * 0.34);
        });
        gsap.utils.toArray(document.querySelectorAll(S + ".node-stub")).forEach((el, i) => {
          tl.fromTo(el, { scaleY: 0, opacity: 0 },
            { scaleY: 1, opacity: 1, duration: 0.25, ease: "power2.out" }, 16.82 + i * 0.34);
        });

        // col 4 — folders STACK down into place
        gsap.utils.toArray(document.querySelectorAll(S + ".folder")).forEach((el, i) => {
          tl.fromTo(el, { y: -90, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }, 19 + i * 0.26);
        });

        // col 5 — layer tracks fade, fills EXTEND
        gsap.utils.toArray(document.querySelectorAll(S + ".layer-track")).forEach((el, i) => {
          tl.fromTo(el, { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power2.out" }, 21.2 + i * 0.18);
        });
        gsap.utils.toArray(document.querySelectorAll(S + ".layer-fill")).forEach((el, i) => {
          tl.fromTo(el, { scaleX: 0 },
            { scaleX: 1, duration: 0.8, ease: "expo.out" }, 21.45 + i * 0.22);
        });

        /* ============ phase 5 (26-36s): green pulse threads, columns breathe ============ */
        // base cable reveals, then idles with a soft glow-breath until scene end
        tl.fromTo(S + ".pulse-base", { opacity: 0 },
          { opacity: 0.25, duration: 0.5, ease: "power2.out" }, 26);
        tl.fromTo(S + ".pulse-base", { opacity: 0.25 },
          { opacity: 0.14, duration: 1.175, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, 26.6);

        // one bright pulse travels the full path through all five columns
        tl.fromTo(S + ".pulse-bright", { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power2.out" }, 26.3);
        tl.fromTo(S + ".pulse-bright",
          { attr: { "stroke-dashoffset": 2490 } },
          { attr: { "stroke-dashoffset": 400 }, duration: 7, ease: "sine.inOut" }, 26.5);

        // header glows flash as the pulse passes each column (inverse of sine.inOut)
        const pathLen = 1950, dashTravel = 2090;
        colSel.forEach((sel, i) => {
          const frac = (colCenters[i] - 90) / 1780;
          const prog = Math.min(1, (frac * pathLen) / dashTravel);
          const u = Math.acos(1 - 2 * prog) / Math.PI;
          const tFlash = 26.5 + 7 * u;
          tl.fromTo(sel + " .h-glow", { opacity: 0 },
            { opacity: 0.9, duration: 0.32, ease: "power3.out", yoyo: true, repeat: 1 }, tFlash);
        });

        // columns breathe to the end of the scene (8 half-cycles x 1.25s = 10s -> ends at 36)
        colSel.forEach((sel, i) => {
          tl.fromTo(sel + " .col-body", { scale: 1, transformOrigin: "50% 100%" },
            { scale: 1.015, duration: 1.25, ease: "sine.inOut", yoyo: true, repeat: 7 }, 26 + i * 0);
        });

        window.__timelines["s06"] = tl;
      })();
    </script>
  </div>
</template>
