    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '[data-composition-id="s09"] ';
        const rng = (seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296))(42);
        const q = sel => document.querySelector(S + sel);

        /* ---------- deterministic geometry ---------- */
        const PINS = [
          [430, 340], [1210, 250], [790, 565], [1545, 430], [320, 735], [1010, 840], [1450, 770]
        ];
        /* board final global position */
        const BX = 398, BY = 309;
        /* board-local route waypoints: start + 6 cell centers in route order */
        const WPS = [
          [72, 124], [198, 124], [562, 124], [926, 124], [926, 338], [562, 338], [198, 338]
        ];
        /* global flight targets: pin i (0..5) -> route cell i, pin 6 -> route start */
        const TARGETS = [
          [BX + WPS[1][0], BY + WPS[1][1]],
          [BX + WPS[2][0], BY + WPS[2][1]],
          [BX + WPS[3][0], BY + WPS[3][1]],
          [BX + WPS[4][0], BY + WPS[4][1]],
          [BX + WPS[5][0], BY + WPS[5][1]],
          [BX + WPS[6][0], BY + WPS[6][1]],
          [BX + WPS[0][0], BY + WPS[0][1]]
        ];
        const ROUTE_CELLS = [".cell-tl", ".cell-tm", ".cell-tr", ".cell-br", ".cell-bm", ".cell-bl"];

        /* build pins synchronously */
        const pinField = q(".pin-field");
        const pinSlots = [], pinDrops = [], pinFlashes = [], pinCores = [];
        for (let i = 0; i < 7; i++) {
          const slot = document.createElement("div");
          slot.className = "pin-slot";
          slot.style.left = PINS[i][0] + "px";
          slot.style.top = PINS[i][1] + "px";
          const drop = document.createElement("div");
          drop.className = "pin-drop";
          const tear = document.createElement("div");
          tear.className = "pin-tear";
          const flash = document.createElement("div");
          flash.className = "pin-flash";
          const core = document.createElement("div");
          core.className = "pin-core";
          drop.appendChild(tear);
          drop.appendChild(flash);
          drop.appendChild(core);
          slot.appendChild(drop);
          pinField.appendChild(slot);
          pinSlots.push(slot); pinDrops.push(drop); pinFlashes.push(flash); pinCores.push(core);
        }

        /* chaos polyline: jittered points pin-to-pin in chaotic visit order */
        const VISITS = [0, 5, 1, 4, 3, 2, 6];
        const cpts = [PINS[0].slice()];
        const visitIdx = [0];
        for (let k = 1; k < 7; k++) {
          const a = PINS[VISITS[k - 1]], b = PINS[VISITS[k]];
          [0.38, 0.72].forEach(f => {
            cpts.push([
              a[0] + (b[0] - a[0]) * f + (rng() - 0.5) * 110,
              a[1] + (b[1] - a[1]) * f + (rng() - 0.5) * 110
            ]);
          });
          cpts.push(b.slice());
          visitIdx.push(cpts.length - 1);
        }
        const chaosLine = q(".chaos-line");
        chaosLine.setAttribute("points", cpts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" "));
        chaosLine.setAttribute("pathLength", "1000");
        /* cumulative length fractions at each visited pin */
        const cum = [0];
        for (let i = 1; i < cpts.length; i++) {
          cum.push(cum[i - 1] + Math.hypot(cpts[i][0] - cpts[i - 1][0], cpts[i][1] - cpts[i - 1][1]));
        }
        const chaosTotal = cum[cum.length - 1];
        const visitFrac = visitIdx.map(ix => cum[ix] / chaosTotal);

        /* route bezier: segments [p0, c1, c2, p1] in board-local coords */
        const SEGS = [
          [WPS[0], [110, 100], [160, 108], WPS[1]],
          [WPS[1], [320, 96], [440, 150], WPS[2]],
          [WPS[2], [680, 100], [800, 146], WPS[3]],
          [WPS[3], [1000, 150], [1000, 312], WPS[4]],
          [WPS[4], [800, 366], [680, 314], WPS[5]],
          [WPS[5], [440, 362], [320, 316], WPS[6]]
        ];
        let d = "M" + WPS[0][0] + "," + WPS[0][1];
        SEGS.forEach(s => {
          d += " C" + s[1][0] + "," + s[1][1] + " " + s[2][0] + "," + s[2][1] + " " + s[3][0] + "," + s[3][1];
        });
        const routeLine = q(".route-line"), routeUnder = q(".route-under");
        routeLine.setAttribute("d", d);
        routeLine.setAttribute("pathLength", "1000");
        routeUnder.setAttribute("d", d);
        routeUnder.setAttribute("pathLength", "1000");

        /* sample beziers for cruise-dot keyframes + waypoint length fractions */
        const cubic = (a, b, c, e, t) => {
          const u = 1 - t;
          return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * e;
        };
        const samples = [[WPS[0][0], WPS[0][1]]];
        const wpSampleIdx = [0];
        SEGS.forEach(s => {
          for (let j = 1; j <= 10; j++) {
            const t = j / 10;
            samples.push([
              cubic(s[0][0], s[1][0], s[2][0], s[3][0], t),
              cubic(s[0][1], s[1][1], s[2][1], s[3][1], t)
            ]);
          }
          wpSampleIdx.push(samples.length - 1);
        });
        const rcum = [0];
        for (let i = 1; i < samples.length; i++) {
          rcum.push(rcum[i - 1] + Math.hypot(samples[i][0] - samples[i - 1][0], samples[i][1] - samples[i - 1][1]));
        }
        const routeTotal = rcum[rcum.length - 1];
        const wpFrac = wpSampleIdx.map(ix => rcum[ix] / routeTotal);

        /* waypoint rings + dots */
        const wpLayer = q(".wp-layer");
        const rings = [], wdots = [];
        WPS.forEach(p => {
          const ring = document.createElement("div");
          ring.className = "wp-ring";
          ring.style.left = p[0] + "px";
          ring.style.top = p[1] + "px";
          const dot = document.createElement("div");
          dot.className = "wp-dot";
          dot.style.left = p[0] + "px";
          dot.style.top = p[1] + "px";
          wpLayer.appendChild(ring);
          wpLayer.appendChild(dot);
          rings.push(ring); wdots.push(dot);
        });

        /* ---------- timeline ---------- */

        /* BG entrances + ambient drift (decoratives) */
        tl.fromTo(S + ".glow-a", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.3);
        tl.fromTo(S + ".glow-b", { opacity: 0 }, { opacity: 0.7, duration: 1.2, ease: "power2.out" }, 0.5);
        tl.fromTo(S + ".glow-a", { scale: 1 }, { scale: 1.12, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: 11 }, 0.4);
        tl.fromTo(S + ".glow-b", { scale: 1.08 }, { scale: 1, duration: 3.6, ease: "sine.inOut", yoyo: true, repeat: 10 }, 0.4);
        tl.fromTo(S + ".contour-a", { opacity: 0 }, { opacity: 0.14, duration: 1.0, ease: "sine.out" }, 0.35);
        tl.fromTo(S + ".contour-b", { opacity: 0 }, { opacity: 0.12, duration: 1.0, ease: "sine.out" }, 0.55);
        tl.fromTo(S + ".contour-a", { x: -34 }, { x: 34, duration: 5.5, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0.3);
        tl.fromTo(S + ".contour-b", { x: 30 }, { x: -30, duration: 4.6, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.3);
        /* warm bleed grows once intention takes over */
        tl.to(S + ".glow-b", { opacity: 1, duration: 2.2, ease: "sine.inOut" }, 25.0);

        /* pins DROP, staggered bounce (entrance on .pin-drop child) */
        for (let i = 0; i < 7; i++) {
          tl.fromTo(pinDrops[i], { y: -420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "bounce.out" }, 0.6 + i * 0.35);
        }
        /* idle stressed pulse on pin cores until the freeze */
        tl.to(pinCores, { opacity: 0.45, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 15 }, 3.4);

        /* chaos polyline SCRIBBLES segment-by-segment with overshoot wiggle */
        tl.fromTo(S + ".chaos-line", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 2.85);
        const chaosKf = [];
        for (let k = 1; k < 7; k++) {
          const v = 1000 * (1 - visitFrac[k]);
          chaosKf.push({ strokeDashoffset: v, duration: 0.32, ease: "back.out(1.8)" });
          chaosKf.push({ strokeDashoffset: v, duration: 1.08, ease: "none" });
        }
        tl.to(S + ".chaos-line", { keyframes: chaosKf }, 3.0);

        /* camera dot DARTS jerkily pin-to-pin (single keyframes transform tween) */
        tl.fromTo(S + ".cam-dot", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.95);
        const camKf = [];
        let prevP = PINS[VISITS[0]];
        for (let k = 1; k < 7; k++) {
          const tp = PINS[VISITS[k]];
          const mx = prevP[0] + (tp[0] - prevP[0]) * 0.88 + (rng() - 0.5) * 70;
          const my = prevP[1] + (tp[1] - prevP[1]) * 0.88 + (rng() - 0.5) * 70;
          camKf.push({ x: mx - PINS[0][0], y: my - PINS[0][1], duration: 0.22, ease: "power3.in" });
          camKf.push({ x: tp[0] - PINS[0][0], y: tp[1] - PINS[0][1], duration: 0.12, ease: "power1.out" });
          camKf.push({ x: tp[0] - PINS[0][0], y: tp[1] - PINS[0][1], duration: 1.06, ease: "none" });
          prevP = tp;
        }
        tl.to(S + ".cam-dot", { keyframes: camKf }, 3.15);

        /* visited pins FLASH stressed rose on each arrival */
        tl.fromTo(pinFlashes[VISITS[0]], { opacity: 0 }, { opacity: 0.85, duration: 0.2, ease: "power3.out", yoyo: true, repeat: 1, immediateRender: false }, 3.25);
        for (let k = 1; k < 7; k++) {
          tl.fromTo(pinFlashes[VISITS[k]], { opacity: 0 }, { opacity: 0.85, duration: 0.2, ease: "power3.out", yoyo: true, repeat: 1, immediateRender: false }, 3.15 + 1.4 * k + 0.34);
        }

        /* t=13: FREEZE — dim veil beat, pins dip with the frame */
        tl.fromTo(S + ".dim-veil", { opacity: 0 }, { opacity: 0.6, duration: 0.35, ease: "power2.out" }, 13.0);
        tl.to(S + ".pin-field", { opacity: 0.55, duration: 0.35, ease: "power2.out" }, 13.0);
        tl.to(S + ".dim-veil", { opacity: 0.35, duration: 0.6, ease: "sine.inOut" }, 14.5);
        tl.to(S + ".pin-field", { opacity: 1, duration: 0.5, ease: "sine.out" }, 14.6);

        /* storyboard board SLIDES in from the right */
        tl.fromTo(S + ".board", { x: 840, opacity: 0 }, { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 14.5);
        tl.fromTo(S + ".board-glow", { opacity: 0 }, { opacity: 0.5, duration: 0.8, ease: "sine.out", immediateRender: false }, 15.4);
        tl.to(S + ".board-glow", { opacity: 0.28, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 11 }, 16.2);

        /* chaos path + camera dot dissolve under the new order — then HARD KILL */
        tl.to(S + ".chaos-line", { opacity: 0, duration: 0.5, ease: "power1.in" }, 15.0);
        tl.to(S + ".cam-dot", { opacity: 0, duration: 0.4, ease: "power1.in" }, 15.1);
        tl.set(S + ".chaos-line", { opacity: 0, visibility: "hidden" }, 15.55);
        tl.set(S + ".cam-dot", { opacity: 0, visibility: "hidden" }, 15.55);

        /* pins LIFT and FLY one-by-one to their cells; morph-flash into shot cards */
        for (let i = 0; i < 7; i++) {
          const t0 = 16.0 + i * 1.1;
          const dx = TARGETS[i][0] - PINS[i][0];
          const dy = TARGETS[i][1] - PINS[i][1];
          tl.fromTo(pinSlots[i], { x: 0, y: 0, scale: 1 }, { x: dx, y: dy, scale: 0.62, duration: 1.0, ease: "power2.inOut", immediateRender: false }, t0);
          tl.to(pinSlots[i], { opacity: 0, duration: 0.3, ease: "power1.in" }, t0 + 0.95);
          tl.set(pinSlots[i], { opacity: 0, visibility: "hidden" }, t0 + 1.3);
          if (i < 6) {
            const cell = S + ROUTE_CELLS[i] + " ";
            tl.fromTo(cell + ".card-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t0 + 0.92);
            tl.set(cell + ".card-flash", { opacity: 0, visibility: "hidden" }, t0 + 1.42);
            tl.fromTo(cell + ".card-wrap", { opacity: 0, scale: 1.28 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, t0 + 0.95);
          }
        }
        /* pin 7 becomes the route start marker */
        tl.fromTo(wdots[0], { opacity: 0 }, { opacity: 0.9, duration: 0.35, ease: "power2.out" }, 23.65);

        /* smooth glowing route DRAWS through the cards like a GPS itinerary */
        tl.fromTo(S + ".route-svg", { opacity: 0 }, { opacity: 0.95, duration: 0.25, ease: "power1.out" }, 24.9);
        tl.fromTo(S + ".route-line", { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 3.5, ease: "sine.inOut" }, 25.0);
        tl.fromTo(S + ".route-under", { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 3.5, ease: "sine.inOut" }, 25.0);

        /* waypoint rings RIPPLE as the draw head passes (sine.inOut inverted for timing) */
        for (let k = 0; k < 7; k++) {
          const tk = 25.0 + 3.5 * (Math.acos(1 - 2 * Math.min(1, wpFrac[k])) / Math.PI);
          tl.fromTo(rings[k], { scale: 0.35, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 0.7, ease: "power2.out", yoyo: false, repeat: 1, immediateRender: false }, tk);
          tl.set(rings[k], { opacity: 0, visibility: "hidden" }, tk + 1.5);
          if (k > 0) {
            tl.fromTo(wdots[k], { opacity: 0 }, { opacity: 0.9, duration: 0.3, ease: "power2.out" }, tk + 0.15);
          }
        }
        tl.to(wdots, { opacity: 0.55, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 11 }, 29.4);

        /* calm cruising pulse dot rides the route at constant speed */
        tl.fromTo(S + ".cruise-dot", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 26.0);
        const cruiseKf = [];
        for (let i = 1; i < samples.length; i++) {
          cruiseKf.push({
            x: samples[i][0] - WPS[0][0],
            y: samples[i][1] - WPS[0][1],
            duration: 6.4 * ((rcum[i] - rcum[i - 1]) / routeTotal),
            ease: "none"
          });
        }
        tl.to(S + ".cruise-dot", { keyframes: cruiseKf }, 26.2);
        tl.to(S + ".cruise-core", { opacity: 0.55, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 8 }, 32.8);

        /* resolve: slow 3% push-in on the board wrapper while cards breathe */
        tl.fromTo(S + ".board-wrap", { scale: 1 }, { scale: 1.03, duration: 5.8, ease: "power2.inOut", immediateRender: false }, 33.0);
        tl.fromTo(S + ".shot-card", { scale: 1 }, { scale: 1.016, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false, stagger: 0.18 }, 33.0);

        window.__timelines["s09"] = tl;
      })();
    </script>
  </div>
</template>
