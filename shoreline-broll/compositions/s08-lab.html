    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const S = '[data-composition-id="s08"] ';
        const root = document.querySelector('[data-composition-id="s08"]');
        const SVGNS = "http://www.w3.org/2000/svg";
        // deterministic PRNG (contract rule 6)
        const rng = (seed => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296))(808);

        const DUR = 37;

        // ---------- generated dust field (BG decorative) ----------
        const dustHost = root.querySelector(".dust");
        const dustDots = [];
        for (let i = 0; i < 22; i++) {
          const d = document.createElement("div");
          d.className = "dust-dot";
          const sz = 2 + Math.round(rng() * 1.5);
          const teal = rng() > 0.55;
          d.style.cssText =
            "left:" + Math.round(rng() * 1880) + "px;" +
            "top:" + Math.round(120 + rng() * 900) + "px;" +
            "width:" + sz + "px;height:" + sz + "px;" +
            "background:" + (teal ? "#35d0ba" : "#8fe000") + ";" +
            "opacity:" + (0.14 + rng() * 0.14).toFixed(2) + ";";
          dustHost.appendChild(d);
          dustDots.push(d);
        }

        // ---------- card data: 9 screens, 3 depth tiers ----------
        // tier 1 = near (large, crisp) / 2 = mid / 3 = far (small, blurred)
        const tiers = {
          1: { blur: 0, op: 1 },
          2: { blur: 1.4, op: 0.82 },
          3: { blur: 2.6, op: 0.6 }
        };
        const cards = [
          { x: 150,  y: 120, w: 340, h: 191, tier: 1, kind: "sunset",  keep: true,  slot: 0 },
          { x: 1450, y: 110, w: 340, h: 191, tier: 1, kind: "corrupt", keep: false, broken: true },
          { x: 90,   y: 560, w: 340, h: 191, tier: 1, kind: "ocean",   keep: true,  slot: 2 },
          { x: 560,  y: 90,  w: 260, h: 146, tier: 2, kind: "neon",    keep: true,  slot: 1 },
          { x: 1250, y: 470, w: 260, h: 146, tier: 2, kind: "noise",   keep: false },
          { x: 430,  y: 430, w: 260, h: 146, tier: 2, kind: "melt",    keep: false, broken: true },
          { x: 920,  y: 330, w: 190, h: 107, tier: 3, kind: "rose",    keep: true,  slot: 3 },
          { x: 1010, y: 150, w: 190, h: 107, tier: 3, kind: "corrupt", keep: false, broken: true },
          { x: 1640, y: 360, w: 190, h: 107, tier: 3, kind: "noise",   keep: false }
        ];

        // dock geometry (page coords) for keeper glides
        const slotCX = i => 540 + 280 * i;
        const slotCY = 957.5;
        const dockCardW = 224;

        // ---------- build card DOM ----------
        const host = root.querySelector(".lab-cards");
        cards.forEach(c => {
          const pos = document.createElement("div");
          pos.className = "cpos";
          pos.style.cssText = "left:" + c.x + "px;top:" + c.y + "px;width:" + c.w + "px;height:" + c.h + "px;";

          const entr = document.createElement("div"); entr.className = "cw-entr";
          const drift = document.createElement("div"); drift.className = "cw-drift";
          const move = document.createElement("div"); move.className = "cw-move";

          const card = document.createElement("div"); card.className = "card";
          const cg = document.createElement("div");
          cg.className = "cg cg-" + c.kind;
          card.appendChild(cg);

          c.slices = [];
          if (c.kind === "sunset" || c.kind === "rose") {
            const sun = document.createElement("div"); sun.className = "sun";
            card.appendChild(sun);
          } else if (c.kind === "ocean") {
            const hz = document.createElement("div"); hz.className = "horizon";
            card.appendChild(hz);
          } else if (c.kind === "corrupt") {
            [18, 44, 70].forEach(top => {
              const sl = document.createElement("div");
              sl.className = "slice";
              sl.style.top = top + "%";
              card.appendChild(sl);
              c.slices.push(sl);
            });
          } else if (c.kind === "noise") {
            const ov = document.createElement("div"); ov.className = "noise-ov";
            card.appendChild(ov);
            c.noiseEl = ov;
          } else if (c.kind === "melt") {
            const blob = document.createElement("div"); blob.className = "melt-blob";
            card.appendChild(blob);
            c.meltEl = blob;
          }
          const sheen = document.createElement("div"); sheen.className = "sheen";
          card.appendChild(sheen);
          move.appendChild(card);

          if (c.keep) {
            const ring = document.createElement("div"); ring.className = "ring";
            move.appendChild(ring);
            c.ringEl = ring;
          } else {
            const svg = document.createElementNS(SVGNS, "svg");
            svg.setAttribute("class", "slash");
            svg.setAttribute("width", c.w);
            svg.setAttribute("height", c.h);
            svg.setAttribute("viewBox", "0 0 " + c.w + " " + c.h);
            const line = document.createElementNS(SVGNS, "line");
            const x1 = c.w * 0.12, y1 = c.h * 0.15, x2 = c.w * 0.88, y2 = c.h * 0.85;
            const len = Math.ceil(Math.hypot(x2 - x1, y2 - y1));
            line.setAttribute("x1", x1); line.setAttribute("y1", y1);
            line.setAttribute("x2", x2); line.setAttribute("y2", y2);
            line.setAttribute("stroke", "#ff6473");
            line.setAttribute("stroke-width", "5");
            line.setAttribute("stroke-linecap", "round");
            line.setAttribute("stroke-dasharray", len);
            line.setAttribute("stroke-dashoffset", len);
            line.setAttribute("opacity", "0.9");
            svg.appendChild(line);
            move.appendChild(svg);
            c.slashLine = line;
            c.slashLen = len;
          }
          const dot = document.createElement("div");
          dot.className = "dot " + (c.keep ? "dot-keep" : "dot-rej");
          move.appendChild(dot);
          c.dotEl = dot;

          drift.appendChild(move);
          entr.appendChild(drift);
          pos.appendChild(entr);
          host.appendChild(pos);
          c.entrEl = entr; c.driftEl = drift; c.moveEl = move; c.cardEl = card; c.cgEl = cg;
        });

        // ---------- helpers ----------
        // idle drift: yoyo with an EVEN number of half-cycles so it ends back at rest
        const addDrift = (el, ampX, ampY, half, t0, t1) => {
          let n = Math.floor((t1 - t0) / half);
          if (n < 2) n = 2;
          if (n % 2) n -= 1;
          tl.fromTo(el, { x: 0, y: 0 },
            { x: ampX, y: ampY, duration: half, ease: "sine.inOut",
              yoyo: true, repeat: n - 1, immediateRender: false }, t0);
        };
        // occasional 2-frame glitch twitch, finite repeats
        const addTwitch = (el, amp, t0, t1) => {
          const kf = 0.18;
          const gap = 3.4 + rng() * 1.1;
          let r = Math.floor((t1 - t0 - kf) / (kf + gap));
          if (r < 1) r = 1;
          tl.to(el, {
            keyframes: [
              { x: amp, duration: 0.05 },
              { x: -amp * 0.7, duration: 0.05 },
              { x: 0, duration: 0.08 }
            ],
            ease: "none", repeat: r, repeatDelay: gap
          }, t0);
        };

        // ---------- BG ambient (all on tl, finite) ----------
        tl.fromTo(S + ".glow-a", { scale: 0.95, opacity: 0.16 },
          { scale: 1.08, opacity: 0.25, duration: 4.5, ease: "sine.inOut",
            yoyo: true, repeat: 7, immediateRender: false }, 0.3);
        tl.fromTo(S + ".glow-b", { scale: 1.06, opacity: 0.14 },
          { scale: 0.94, opacity: 0.22, duration: 5.2, ease: "sine.inOut",
            yoyo: true, repeat: 6, immediateRender: false }, 0.3);
        tl.fromTo(S + ".lab-grid", { x: 0 },
          { x: -70, duration: 36.4, ease: "sine.inOut", immediateRender: false }, 0.3);
        dustDots.forEach(d => {
          tl.fromTo(d, { x: 0, y: 0 },
            { x: 40 + rng() * 90, y: -(60 + rng() * 110),
              duration: 20 + rng() * 14, ease: "none", immediateRender: false },
            0.3 + rng() * 2);
        });

        // ---------- dock rises dim ----------
        tl.fromTo(S + ".dock-w", { y: 80, opacity: 0 },
          { y: 0, opacity: 0.55, duration: 0.9, ease: "expo.out" }, 1.2);

        // ---------- card entrances: float in from depth ----------
        const entrEases = ["expo.out", "back.out(1.5)", "power3.out"];
        cards.forEach((c, i) => {
          const t = tiers[c.tier];
          c.entrT = 0.6 + i * 0.5;
          tl.fromTo(c.entrEl,
            { scale: 0.7, opacity: 0, filter: "blur(9px)" },
            { scale: 1, opacity: t.op, filter: "blur(" + t.blur + "px)",
              duration: 0.9, ease: entrEases[i % 3] }, c.entrT);
        });

        // ---------- verdict + motion schedule ----------
        const keepers = cards.filter(c => c.keep);          // c0,c3,c2,c6 in slot order 0,1,2,3
        const rejects = cards.filter(c => !c.keep);
        keepers.sort((a, b) => a.slot - b.slot);
        keepers.forEach((c, k) => { c.glideT = 19 + k * 2; });
        rejects.forEach((c, j) => { c.recT = 19.5 + j * 0.8; });

        // ---------- idle drift (parallax: near drifts more) ----------
        cards.forEach((c, i) => {
          const ampBase = c.tier === 1 ? 16 + rng() * 8 : c.tier === 2 ? 10 + rng() * 5 : 6 + rng() * 4;
          const dir = (i % 2 === 0) ? 1 : -1;
          const half = 1.7 + rng() * 1.5;
          const tEnd = c.keep ? c.glideT : c.recT + 1.5;
          addDrift(c.driftEl, dir * ampBase * 0.45, dir * ampBase, half, c.entrT + 1.1, tEnd);
        });

        // ---------- broken-card twitches + failure textures ----------
        cards.forEach(c => {
          const t0 = c.entrT + 1.6;
          const t1 = c.keep ? c.glideT : c.recT;
          if (c.broken) addTwitch(c.cardEl, 5 + rng() * 3, t0, t1);
          c.slices.forEach(sl => {
            const a = 3 + rng() * 3;
            const d2 = 0.9 + rng() * 0.8;
            const r = Math.max(1, Math.floor((t1 - t0) / d2) - 1);
            tl.fromTo(sl, { x: -a }, { x: a, duration: d2, ease: "sine.inOut",
              yoyo: true, repeat: r, immediateRender: false }, t0);
          });
          if (c.noiseEl) {
            const d2 = 0.8 + rng() * 0.5;
            const r = Math.max(1, Math.floor((t1 - t0) / d2) - 1);
            tl.fromTo(c.noiseEl, { opacity: 0.3 }, { opacity: 0.6, duration: d2,
              ease: "sine.inOut", yoyo: true, repeat: r, immediateRender: false }, t0);
          }
          if (c.meltEl) {
            const r = Math.max(1, Math.floor((t1 - t0) / 2.6) - 1);
            tl.fromTo(c.meltEl, { y: -6 }, { y: 14, duration: 2.6, ease: "sine.inOut",
              yoyo: true, repeat: r, immediateRender: false }, t0);
          }
        });

        // ---------- cursor pass: keep / reject verdicts (t 9.6 - 18) ----------
        const CX0 = 980, CY0 = 760; // matches .cursor CSS base position
        tl.fromTo(S + ".cursor-w", { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: "power1.out" }, 9.6);
        const order = [0, 1, 3, 5, 6, 7, 2, 4, 8];
        order.forEach((ci, k) => {
          const c = cards[ci];
          const px = c.x + c.w * 0.72 - CX0;
          const py = c.y + c.h * 0.84 - CY0;
          const arrive = 10.2 + k * 0.9;
          tl.to(S + ".cursor", { x: px, y: py, duration: 0.55, ease: "power2.inOut" }, arrive - 0.55);
          const vt = arrive + 0.18;
          if (c.keep) {
            // selection ring locks in + green status dot
            tl.fromTo(c.ringEl, { opacity: 0, scale: 1.35 },
              { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, vt);
            tl.fromTo(c.dotEl, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, vt + 0.1);
          } else {
            // dim + drawn slash + rose status dot
            tl.to(c.cardEl, { opacity: 0.45, duration: 0.4, ease: "power1.in" }, vt);
            tl.fromTo(c.slashLine,
              { attr: { "stroke-dashoffset": c.slashLen } },
              { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power1.in" }, vt);
            tl.fromTo(c.dotEl, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, vt + 0.1);
          }
        });
        // cursor done: mid-scene fade + hard kill
        tl.to(S + ".cursor-w", { opacity: 0, duration: 0.4, ease: "power1.in" }, 18.4);
        tl.set(S + ".cursor-w", { opacity: 0, visibility: "hidden" }, 18.85);

        // ---------- dock levels up as selection ends ----------
        tl.to(S + ".dock-w", { opacity: 1, duration: 0.8, ease: "power2.out" }, 18.3);
        tl.to(S + ".dock", {
          boxShadow: "0 0 70px rgba(143,224,0,0.35)",
          borderColor: "rgba(143,224,0,0.55)", duration: 0.8, ease: "power2.out"
        }, 18.3);
        tl.to(S + ".dock", {
          boxShadow: "0 0 90px rgba(143,224,0,0.50)",
          duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 5
        }, 20);

        // ---------- keepers detach and glide into dock slots ----------
        keepers.forEach(c => {
          const dx = slotCX(c.slot) - (c.x + c.w / 2);
          const dy = slotCY - (c.y + c.h / 2);
          const sc = dockCardW / c.w;
          tl.fromTo(c.moveEl, { x: 0, y: 0, scale: 1 },
            { x: dx, y: dy, scale: sc, duration: 1.3, ease: "power2.inOut" }, c.glideT);
          // far/mid keepers crisp up + brighten as they come forward
          if (c.tier !== 1) {
            tl.to(c.entrEl, { opacity: 1, filter: "blur(0px)", duration: 1, ease: "power2.out" }, c.glideT);
          }
          // ring releases (mid-scene fade + hard kill)
          tl.to(c.ringEl, { opacity: 0, duration: 0.45, ease: "power1.in" }, c.glideT);
          tl.set(c.ringEl, { opacity: 0, visibility: "hidden" }, c.glideT + 0.5);
          // slot flare + border lock on arrival
          const arr = c.glideT + 1.15;
          const slotEl = root.querySelector(".slot-" + c.slot);
          tl.fromTo(slotEl.querySelector(".flare"), { opacity: 0 },
            { opacity: 0.9, duration: 0.22, ease: "power3.out",
              yoyo: true, repeat: 1, immediateRender: false }, arr);
          tl.to(slotEl, { borderColor: "rgba(143,224,0,0.75)", duration: 0.3, ease: "power3.out" }, arr);
          // docked card breathes with a slow Ken Burns on its gradient child
          tl.fromTo(c.cgEl, { scale: 1 },
            { scale: 1.07, duration: 36.6 - (c.glideT + 1.3), ease: "sine.inOut",
              immediateRender: false }, c.glideT + 1.3);
        });

        // ---------- rejects recede into depth (mid-scene, hard-killed) ----------
        rejects.forEach(c => {
          tl.fromTo(c.moveEl, { x: 0, y: 0, scale: 1, opacity: 1, filter: "blur(0px)" },
            { y: 20, scale: 0.8, opacity: 0, filter: "blur(6px)",
              duration: 1.5, ease: "power2.in" }, c.recT);
          tl.set(c.moveEl, { opacity: 0, visibility: "hidden" }, c.recT + 1.55);
        });

        // ---------- dock finale: underline draw + film-strip pulse ----------
        tl.fromTo(S + ".dock-line", { attr: { "stroke-dashoffset": 1060 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 1.7, ease: "power2.inOut" }, 30);
        tl.fromTo(S + ".pip-w", { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" }, 31.7);
        tl.fromTo(S + ".pip", { x: 0 },
          { x: 1040, duration: 2.2, ease: "sine.inOut", repeat: 1, immediateRender: false }, 31.9);
        for (let i = 0; i < 4; i++) {
          tl.fromTo(S + ".slot-" + i + " .slot-glow", { opacity: 0.12 },
            { opacity: 0.65, duration: 0.42, ease: "sine.inOut",
              yoyo: true, repeat: 8, immediateRender: false }, 32.2 + i * 0.35);
        }

        window.__timelines["s08"] = tl;
      })();
    </script>
  </div>
</template>
